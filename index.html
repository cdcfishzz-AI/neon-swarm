  function drawFPS() {
    ctx.textAlign = 'right';
    ctx.font = '500 11px ' + FONT;
    ctx.fillStyle = 'rgba(120, 150, 200, 0.4)';
    ctx.fillText(fps.toFixed(0) + ' FPS', W - 30, H - 40);
  }

  function cardRect(i) {
    var cw = 220, ch = 244, gap = 26;
    var total = cw * 3 + gap * 2;
    var x0 = (W - total) / 2;
    return { x: x0 + i * (cw + gap), y: 232, w: cw, h: ch };
  }

  function menuRects() {
    var labels = [
      '声音：' + (muted ? '关' : '开') + ' (M)',
      '全屏：' + (document.fullscreenElement ? '开' : '关') + ' (F)',
      progress.metaUnlocked ? '系统升级 (U)' : '系统升级 (锁)',
      Date.now() < menu.resetUntil ? '再次点击确认' : '重置最高分'
    ];
    var widths = [132, 120, 148, 158], gap = 14;
    var total = 0, i;
    for (i = 0; i < widths.length; i++) total += widths[i];
    total += gap * (widths.length - 1);
    var x = (W - total) / 2;
    var out = [];
    for (i = 0; i < widths.length; i++) {
      out.push({ x: x, y: 512, w: widths[i], h: 34, label: labels[i], index: i });
      x += widths[i] + gap;
    }
    return out;
  }

  function menuHit(mx, my) {
    var rs = menuRects();
    for (var i = 0; i < rs.length; i++) {
      if (mx >= rs[i].x && mx <= rs[i].x + rs[i].w && my >= rs[i].y && my <= rs[i].y + rs[i].h) return i;
    }
    return -1;
  }

  function toggleMute() {
    muted = !muted;
    applyMute();
    if (!muted && actx && actx.state === 'suspended') {
      try { actx.resume(); } catch (e) {}
    }
  }

  function toggleFullscreen() {
    try {
      if (!document.fullscreenElement) {
        var p = document.documentElement.requestFullscreen && document.documentElement.requestFullscreen();
        if (p && p.catch) p.catch(function () {});
      } else {
        var q = document.exitFullscreen && document.exitFullscreen();
        if (q && q.catch) q.catch(function () {});
      }
    } catch (e) {}
  }

  function menuAction(i) {
    if (i === 0) { toggleMute(); sfx.uiHover(); return; }
    if (i === 1) { toggleFullscreen(); sfx.uiHover(); return; }
    if (i === 2) { openMeta(); return; }
    if (i === 3) {
      var now = Date.now();
      if (menu.resetUntil && now < menu.resetUntil) {
        best = 0; saveBest(); menu.resetUntil = 0; sfx.uiBack();
      } else {
        menu.resetUntil = now + 2500; sfx.uiHover();
      }
    }
  }

  function syncCursor() {
    var hide = S.mode === 'playing';
    if (hide !== cursorHidden) {
      cursorHidden = hide;
      canvas.style.cursor = hide ? 'none' : 'default';
    }
  }

  function metaRowRect(i) {
    return { x: 120, y: 160 + i * 86, w: 720, h: 74 };
  }
  function metaBuyRect(i) {
    var r = metaRowRect(i);
    return { x: r.x + r.w - 156, y: r.y + 19, w: 136, h: 36 };
  }
  function metaCloseRect() {
    return { x: W - 150, y: 82, w: 110, h: 32 };
  }

  function metaHit(mx, my) {
    var cr = metaCloseRect();
    if (mx >= cr.x && mx <= cr.x + cr.w && my >= cr.y && my <= cr.y + cr.h) return { type: 'close' };
    for (var i = 0; i < META_DEFS.length; i++) {
      var br = metaBuyRect(i);
      if (mx >= br.x && mx <= br.x + br.w && my >= br.y && my <= br.y + br.h) {
        return { type: 'buy', index: i };
      }
      var r = metaRowRect(i);
      if (mx >= r.x && mx <= r.x + r.w && my >= r.y && my <= r.y + r.h) {
        return { type: 'row', index: i };
      }
    }
    return null;
  }

  function openMeta() {
    if (S.mode !== 'select' && S.mode !== 'dead') return;
    if (!progress.metaUnlocked) {
      showSelectNotice('学员07，权限未开放：击穿第 3 局模拟核心后，系统升级才会解锁。');
      setSysLog('权限未开放：击穿第 3 局模拟核心。');
      sfx.uiHover();
      return;
    }
    S.metaOpen = true;
    S.metaHover = -1;
    sfx.upgradeOpen();
  }

  function closeMeta() {
    S.metaOpen = false;
    S.metaHover = -1;
    sfx.uiBack();
  }

  function drawMeta() {
    ctx.save();
    ctx.globalAlpha = 0.985;
    ctx.fillStyle = '#03040a';
    ctx.fillRect(0, 0, W, H);
    ctx.restore();

    ctx.save();
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.shadowColor = '#5ee8ff';
    ctx.shadowBlur = 20;
    ctx.fillStyle = '#eaf6ff';
    ctx.font = '800 30px ' + FONT;
    ctx.fillText('SYSTEM UPGRADE TREE', W / 2, 88);
    ctx.shadowBlur = 0;
    ctx.fillStyle = '#ffd45e';
    ctx.font = '600 14px ' + FONT;
    ctx.fillText('系统升级树 · 数据碎片 \u25c6 ' + meta.shards, W / 2, 120);
    ctx.restore();

    var cr = metaCloseRect();
    ctx.save();
    ctx.fillStyle = 'rgba(12, 18, 34, 0.9)';
    ctx.strokeStyle = 'rgba(160, 190, 240, 0.5)';
    ctx.lineWidth = 1.2;
    ctx.beginPath(); ctx.rect(cr.x, cr.y, cr.w, cr.h); ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#cfe0f5';
    ctx.font = '600 12px ' + FONT;
    ctx.textAlign = 'center';
    ctx.fillText('关闭 (U)', cr.x + cr.w / 2, cr.y + cr.h / 2 + 1);
    ctx.restore();

    for (var i = 0; i < META_DEFS.length; i++) {
      var d = META_DEFS[i], r = metaRowRect(i), br = metaBuyRect(i);
      var lv = meta[d.id], maxed = lv >= d.max, cost = metaCost(d);
      var canBuy = !maxed && meta.shards >= cost;
      var hover = S.metaHover === i;
      ctx.save();
      ctx.fillStyle = hover ? 'rgba(22, 36, 62, 0.96)' : 'rgba(10, 16, 30, 0.9)';
      ctx.strokeStyle = canBuy ? d.color : 'rgba(110, 130, 170, 0.28)';
      ctx.lineWidth = hover ? 2 : 1.2;
      ctx.beginPath(); ctx.rect(r.x, r.y, r.w, r.h); ctx.fill(); ctx.stroke();

      ctx.textAlign = 'left';
      ctx.fillStyle = d.color;
      ctx.font = '800 17px ' + FONT;
      ctx.fillText(d.name, r.x + 20, r.y + 25);
      ctx.fillStyle = 'rgba(190, 210, 240, 0.6)';
      ctx.font = '400 12px ' + FONT;
      ctx.fillText(d.desc, r.x + 20, r.y + 49);

      // 等级刻度
      for (var p = 0; p < d.max; p++) {
        var px = r.x + 390 + p * 24, py = r.y + 34;
        ctx.beginPath();
        ctx.moveTo(px, py - 8); ctx.lineTo(px + 7, py); ctx.lineTo(px, py + 8); ctx.lineTo(px - 7, py);
        ctx.closePath();
        if (p < lv) { ctx.fillStyle = d.color; ctx.fill(); }
        else { ctx.strokeStyle = 'rgba(120, 150, 200, 0.35)'; ctx.lineWidth = 1.2; ctx.stroke(); }
      }
      ctx.fillStyle = 'rgba(150, 180, 230, 0.5)';
      ctx.font = '500 11px ' + FONT;
      ctx.fillText('Lv.' + lv + ' / ' + d.max, r.x + 390, r.y + 56);

      ctx.fillStyle = maxed ? 'rgba(120, 150, 200, 0.12)' :
        (canBuy ? (hover ? 'rgba(94, 232, 255, 0.22)' : 'rgba(12, 18, 34, 0.9)') : 'rgba(120, 150, 200, 0.08)');
      ctx.strokeStyle = maxed ? 'rgba(120, 150, 200, 0.3)' : (canBuy ? (hover ? '#5ee8ff' : 'rgba(94, 232, 255, 0.55)') : 'rgba(120, 150, 200, 0.22)');
      ctx.lineWidth = hover ? 2 : 1.2;
      ctx.beginPath(); ctx.rect(br.x, br.y, br.w, br.h); ctx.fill(); ctx.stroke();
      ctx.textAlign = 'center';
      ctx.fillStyle = maxed ? 'rgba(160, 180, 220, 0.5)' : (canBuy ? '#dff7ff' : 'rgba(140, 160, 200, 0.45)');
      ctx.font = '700 12px ' + FONT;
      ctx.fillText(maxed ? 'MAX' : ('升级 \u25c6' + cost), br.x + br.w / 2, br.y + br.h / 2 + 1);
      ctx.restore();
    }

    ctx.save();
    ctx.textAlign = 'center';
    ctx.fillStyle = 'rgba(140, 170, 220, 0.45)';
    ctx.font = '400 12px ' + FONT;
    ctx.fillText('数据碎片来自 Boss 残骸（每击杀 1 只 Boss +1） · 永久强化在下一局生效 · U / Esc 关闭', W / 2, 548);
    ctx.restore();
  }

  function drawCrosshair() {
    var x = input.mx, y = input.my;
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    ctx.strokeStyle = '#9feaff';
    ctx.fillStyle = '#eaffff';
    ctx.globalAlpha = 0.85;
    ctx.lineWidth = 1.2;
    ctx.beginPath();
    ctx.arc(x, y, 8, 0, TAU);
    ctx.stroke();
    for (var i = 0; i < 4; i++) {
      var a = i * Math.PI / 2 + Math.PI / 4;
      var c = Math.cos(a), s = Math.sin(a);
      ctx.beginPath();
      ctx.moveTo(x + c * 12, y + s * 12);
      ctx.lineTo(x + c * 17, y + s * 17);
      ctx.stroke();
    }
    ctx.beginPath();
    ctx.arc(x, y, 1.5, 0, TAU);
    ctx.fill();
    ctx.restore();
  }

      ctx.fillStyle = 'rgba(150, 180, 230, 0.5)';
      ctx.font = '500 11px ' + FONT;
      ctx.fillText('速度 ' + sh.speed + ' · 射速 ×' + sh.fire.toFixed(2) + ' · 伤害 ×' + sh.dmg.toFixed(2),
        r.x + r.w / 2, r.y + 194);
      bar(r.x + 24, r.y + 214, r.w - 48, 4, sh.hp / 4, '#6dffb0');

      ctx.fillText('HP ' + sh.hp, r.x + r.w / 2, r.y + 228);
      if (id !== 'striker' && !selUnlocks.ships) {
        ctx.fillStyle = 'rgba(3, 6, 14, 0.76)';

    var brs = menuRects();

      ctx.fillStyle = bh ? 'rgba(24, 40, 70, 0.95)' : 'rgba(12, 18, 34, 0.85)';
      ctx.strokeStyle = bh ? accent : (b === 3 ? 'rgba(255, 111, 174, 0.65)' : 'rgba(120, 160, 255, 0.35)');

      ctx.fill();

      ctx.fillStyle = b === 3 ? '#ff9fc4' : (b === 2 ? '#ffd45e' : (bh ? '#dff7ff' : 'rgba(180, 205, 240, 0.75)'));
      ctx.font = '600 12px ' + FONT;
      ctx.fillText(br.label, br.x + br.w / 2, br.y + br.h / 2 + 1);

    if (S.selectNoticeT > 0) {

    }
    ctx.restore();
  }

  // 死亡报告由剧情阶段决定：没看见真相 = 训练报告；看见了 = 行动报告
  function buildDeathReport() {
    var phase = story.phase < 0 ? 0 : story.phase;
    var grade = S.score >= 3000 ? 'S' : S.score >= 1500 ? 'A' : S.score >= 600 ? 'B' : 'C';
    var stats = '读数 ' + S.score + ' 分 · ' + S.kills + ' 击杀 · 峰值连击 ' + S.maxCombo;
    var report = { phase: phase, title: '', lines: [], hint: '' };
    if (phase === 0) {
      report.title = '训练终止';
      report.lines = ['学员状态：离线', stats, '评估：' + grade + '（模拟标准）', '备注：本训练不计入真实伤亡。'];
      report.hint = '按 R 返回机库';
    } else if (phase === 1) {
      report.title = '训练异常终止';
      report.lines = ['学员状态：离线（异常）', stats, '评估：' + grade + '（数据不完整）', '备注：靶机数量与记录不符。', '异常代码：0x4E4F'];
      report.hint = '按 R 返回机库';
    } else {
      report.title = '行动终止';
      report.lines = ['目标确认：非模拟生命体', stats, '评估：A（超出授权）', '备注：系统从未被授权告知您这一点。'];
      report.hint = '按 R 返回机库';
    }
    report.lines.push('Boss 残骸 +' + (S.shardsEarned || 0) + ' · 持有 ' + meta.shards);
    report.hint = '按 R 返回机库 · 按 U 系统升级树';
    return report;
  }

  function updateDeath(dt) {
    S.deathT += dt;
    S.hurtFlash = Math.max(0, S.hurtFlash - dt);
  }

  function drawVictoryFlash() {
    if (S.victoryFlash <= 0) return;
    ctx.save();
    ctx.globalAlpha = 0.32 * Math.min(1, S.victoryFlash / 0.35);
    ctx.fillStyle = '#ffd45e';
    ctx.fillRect(0, 0, W, H);
    ctx.restore();
  }

  function drawRewardTint() {
    var k = clamp(S.rewardT / S.rewardDur, 0, 1);
    ctx.save();
    ctx.globalAlpha = 0.16 * (1 - k * 0.45);
    var g = ctx.createRadialGradient(W / 2, H / 2, H * 0.18, W / 2, H / 2, H * 0.82);
    g.addColorStop(0, 'rgba(255, 212, 94, 0)');
    g.addColorStop(1, 'rgba(255, 212, 94, 0.6)');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);
    ctx.restore();
  }

  function drawSysLog() {
    var l = S.sysLog;
    if (!l) return;
    var a = Math.min(1, l.t / 0.12) * Math.min(1, (l.dur - l.t) / 0.35);
    if (a <= 0) return;
    ctx.save();
    ctx.textAlign = 'center';
    ctx.globalAlpha = a * 0.9;
    ctx.font = '500 11px ' + FONT;
    var tw = ctx.measureText(l.text).width;
    ctx.fillStyle = 'rgba(3, 4, 10, 0.78)';

  // 渐暗 → 报告逐行浮现 → 重开提示：全程只改 alpha，无额外层级
  function drawDeathOverlay() {
    var t = S.deathT, r = S.deathReport;
    var fade = clamp(t / 0.9, 0, 1);
    ctx.save();
    ctx.globalAlpha = 0.9 * fade;
    ctx.fillStyle = '#03040a';
    ctx.fillRect(0, 0, W, H);
    ctx.restore();
    if (!r) return;

    var a0 = Math.min(1, Math.max(0, (t - 0.35) / 0.5));
    ctx.save();
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.globalAlpha = a0 * 0.9;
    ctx.fillStyle = r.phase === 2 ? '#ff6fae' : '#9EE7FF';
    ctx.font = '800 28px ' + FONT;
    ctx.fillText(r.title, W / 2, H / 2 - 120);
    ctx.globalAlpha = a0 * 0.3;
    ctx.fillStyle = '#9EE7FF';
    ctx.fillRect(W / 2 - 150, H / 2 - 96, 300, 1);
    if (Math.floor(t * 2) % 2 === 0) {
      ctx.globalAlpha = a0 * 0.6;
      ctx.fillStyle = '#ff3f8e';
      ctx.fillRect(W / 2 + 152, H / 2 - 128, 6, 6);
    }
    ctx.restore();

    for (var i = 0; i < r.lines.length; i++) {
      var la = Math.min(1, Math.max(0, (t - 0.65 - i * 0.28) / 0.45));
      if (la <= 0) continue;
      ctx.save();
      ctx.globalAlpha = la * (i === 0 ? 0.85 : 0.6);
      ctx.textAlign = 'center';
      ctx.fillStyle = i === 0 ? '#eaf6ff' : '#9fb8d8';
      ctx.font = (i === 0 ? '600 15px ' : '400 13px ') + FONT;
      ctx.fillText(r.lines[i], W / 2, H / 2 - 58 + i * 26);
      ctx.restore();
    }

    var hintAt = 0.65 + r.lines.length * 0.28;
    var ha = Math.min(1, Math.max(0, (t - hintAt) / 0.5));
    if (ha > 0) {
      ctx.save();
      ctx.globalAlpha = ha * (0.4 + 0.2 * Math.sin(t * 4));
      ctx.textAlign = 'center';
      ctx.fillStyle = '#9EE7FF';
      ctx.font = '500 13px ' + FONT;
      ctx.fillText(r.hint, W / 2, H / 2 + 108);
      ctx.restore();
    }
  }

  function drawOverlay() {
    if (S.mode === 'paused') {
      ctx.fillStyle = 'rgba(3, 4, 10, 0.72)';
      ctx.fillRect(0, 0, W, H);
      ctx.textAlign = 'center';

      ctx.fillText('已暂停', W / 2, H / 2 - 10);
      ctx.font = '500 15px ' + FONT;
      ctx.fillStyle = COL.dim;
      ctx.fillText('按 P 继续', W / 2, H / 2 + 44);
    }
    if (S.mode === 'dead') drawDeathOverlay();
  }

  // ===== 叙事逻辑：阶段只升不降；同阶段按顺序循环；全局 6s 冷却 =====
  function storyPhaseFor(combo) {
    if (combo >= 80) return 2;
    if (combo >= 30) return 1;
    return 0;
  }

  function showStory(phase) {
    var pool = STORY_LINES[STORY_KEYS[phase]];
    var idx = story.cursor[phase] % pool.length;
    story.cursor[phase] = idx + 1;
    if (phase > story.phase) story.phase = phase;
    story.text = pool[idx].text;
    story.t = 0;
    story.cooldown = 6;
    story.nextTrigger = (Math.floor(S.combo / 10) + 1) * 10;
    if (phase === 2) story.flicker = 0.55;
  }

  function updateStory(dt) {
    if (story.cooldown > 0) story.cooldown -= dt;
    if (story.flicker > 0) story.flicker = Math.max(0, story.flicker - dt);
    if (story.t >= 0) {
      story.t += dt;
      if (story.t > story.dur) story.t = -1;
    }
    if (story.phase < 0) { showStory(0); return; }
    var np = storyPhaseFor(S.combo);
    if (np > story.phase) { showStory(np); return; }
    if (S.combo > 0 && S.combo >= story.nextTrigger && story.cooldown <= 0) {
      showStory(story.phase);
    }
  }

  // 真相期 0.55s 屏幕闪烁：一次全屏 fillRect，无额外层级
  function drawStoryFlicker() {
    if (story.flicker <= 0) return;
    var a = 0.18 * Math.abs(Math.sin(story.flicker * 42)) * (story.flicker / 0.55);
    ctx.fillStyle = 'rgba(200, 240, 255, ' + a.toFixed(3) + ')';
    ctx.fillRect(0, 0, W, H);
  }

  // 屏幕上方单行文本：0.25s 淡入 / 1.6s 停留 / 0.55s 淡出
  function drawStory() {
    if (S.boss || S.mode === 'upgrade') return;   // Boss 战/强化界面让位
    if (story.t < 0) return;
    var a;
    if (story.t < 0.25) a = story.t / 0.25;
    else if (story.t < 1.85) a = 1;
    else a = Math.max(0, (story.dur - story.t) / 0.55);
    if (a <= 0) return;
    ctx.save();
    ctx.globalAlpha = a * 0.55;
    ctx.fillStyle = '#9EE7FF';
    ctx.font = '400 13px ' + FONT;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(story.text, W / 2, 108);
    ctx.restore();
  }

  function render() {
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    drawBackground();
    ctx.save();
    ctx.beginPath();
    ctx.rect(0, 0, W, H);
    ctx.clip();
    ctx.translate(W / 2 + S.shakeX, H / 2 + S.shakeY);
    ctx.rotate(S.shakeRot);
    if (S.mode === 'dead') {
      var zoom = 1 + Math.min(S.deathT, 1.4) * 0.022;   // 缓慢推近
      ctx.scale(zoom, zoom);
    } else if (S.mode === 'intro') {
      var iz = 1.08 - 0.08 * clamp(S.introT / 1.4, 0, 1);   // 从 1.08 拉回 1.0
      ctx.scale(iz, iz);
    }
    ctx.translate(-W / 2, -H / 2);
    drawWorld();
    ctx.restore();
    if (S.mode !== 'select' && S.mode !== 'intro') {
      if (S.slow > 0) {
        ctx.fillStyle = 'rgba(120, 80, 255, 0.06)';
        ctx.fillRect(0, 0, W, H);
      }
      drawStoryFlicker();
      drawHurt();
      if (S.mode === 'reward') drawRewardTint();
      if (S.wavePhase === 'warning') drawWaveWarning();
      drawHUD();
      drawVictoryFlash();
      drawStory();
      drawSysLog();
      if (S.mode === 'playing') drawCrosshair();
      drawFPS();
      if (S.mode === 'upgrade') drawUpgrade();
      drawOverlay();
    }
    if (S.mode === 'intro') drawIntro();
    if (S.mode === 'select') drawSelect();
    if (S.metaOpen) drawMeta();
  }

  // 部署过渡：黑场淡入 + 训练接入文案
  function drawIntro() {
    var t = S.introT, d = 1.4;
    var fade = 1 - clamp(t / 0.45, 0, 1);
    ctx.save();
    ctx.globalAlpha = 0.92 * fade;
    ctx.fillStyle = '#03040a';
    ctx.fillRect(0, 0, W, H);
    ctx.restore();
    var a = Math.min(1, Math.max(0, (t - 0.25) / 0.35));
    var out = Math.min(1, Math.max(0, (t - (d - 0.35)) / 0.35));
    var al = a * (1 - out);
    if (al <= 0) return;
    ctx.save();
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.globalAlpha = al * 0.9;
    ctx.fillStyle = '#9EE7FF';
    ctx.font = '800 26px ' + FONT;
    var ii = runInfo(S.runNo);
    ctx.fillText('训练接入 · ' + ii.title, W / 2, H / 2 - 92);
    ctx.globalAlpha = al * 0.62;
    ctx.fillStyle = '#9fb8d8';
    ctx.font = '400 13px ' + FONT;
    ctx.fillText(ii.line || ii.sub, W / 2, H / 2 - 54);
    ctx.globalAlpha = al * 0.25;
    ctx.fillStyle = '#9EE7FF';
    ctx.fillRect(W / 2 - 120, H / 2 - 118, 240, 1);
    ctx.restore();
  }

  // ===== 主循环 =====
  var last = 0, fps = 60;

  function frame(now) {
    if (last === 0) last = now;
    var dt = (now - last) / 1000;
    last = now;
    if (dt < 0) dt = 0;
    if (dt > 0.05) dt = 0.05;
    if (S.mode === 'playing') update(dt);
    else if (S.mode === 'dead') updateDeath(dt);
    else if (S.mode === 'intro') updateIntro(dt);
    else if (S.mode === 'reward') updateReward(dt);
    else if (S.mode === 'upgrade') updateUpgrade(dt);
    else if (S.mode === 'select') {
      S.selectT += dt;
      if (S.selectNoticeT > 0) S.selectNoticeT = Math.max(0, S.selectNoticeT - dt);
    }
    if (dt > 0) fps = fps * 0.92 + (1 / dt) * 0.08;
    render();
    syncCursor();
    requestAnimationFrame(frame);
  }

  // ===== 输入 =====
  window.addEventListener('keydown', function (e) {
    var k = e.key.toLowerCase();
    if (S.metaOpen) {
      if (k === 'u' || k === 'escape') closeMeta();
      return;
    }
    if (k === 'w' || k === 'arrowup') input.up = true;
    else if (k === 's' || k === 'arrowdown') input.down = true;
    else if (k === 'a' || k === 'arrowleft') input.left = true;
    else if (k === 'd' || k === 'arrowright') input.right = true;
    else if (k === 'r') {
      if (S.mode === 'dead') returnToSelect();
      else if (S.mode === 'playing' || S.mode === 'paused') {
        beginRun();
        reset(S.ship); sfx.start(); if (actx) startMusic();
      }
    } else if (k === '1' || k === '2' || k === '3') {
      if (S.mode === 'select') selectShip(SHIP_ORDER[parseInt(k, 10) - 1]);
      else if (S.mode === 'upgrade') chooseUpgrade(parseInt(k, 10) - 1);
    } else if (k === 'q') {
      switchEvoForm();
    } else if (k === 'u') {
      if (S.mode === 'select' || S.mode === 'dead') openMeta();
    } else if (k === 'p' || k === 'escape') {
      if (S.mode === 'playing') { S.mode = 'paused'; duckMusic(true); }
      else if (S.mode === 'paused') { S.mode = 'playing'; duckMusic(false); }
    } else if (k === 'm') { toggleMute(); }
    else if (k === 'f') { toggleFullscreen(); }
    if (k === 'arrowup' || k === 'arrowdown' || k === 'arrowleft' || k === 'arrowright' || k === ' ') e.preventDefault();
    if (S.mode !== 'dead') startMusic();
  });

  window.addEventListener('keyup', function (e) {
    var k = e.key.toLowerCase();
    if (k === 'w' || k === 'arrowup') input.up = false;
    else if (k === 's' || k === 'arrowdown') input.down = false;
    else if (k === 'a' || k === 'arrowleft') input.left = false;
    else if (k === 'd' || k === 'arrowright') input.right = false;
  });

  canvas.addEventListener('mousemove', function (e) {
    var r = canvas.getBoundingClientRect();
    input.mx = (e.clientX - r.left) / r.width * W;
    input.my = (e.clientY - r.top) / r.height * H;
    if (S.metaOpen) {
      var mhit = metaHit(input.mx, input.my);
      var mrow = mhit && (mhit.type === 'row' || mhit.type === 'buy') ? mhit.index : -1;
      if (mrow !== S.metaHover) {
        S.metaHover = mrow;
        if (mrow >= 0) sfx.uiHover();
      }
    } else if (S.mode === 'upgrade' && S.upgrade) {
      var hi = upgradeHit(input.mx, input.my);
      if (hi !== S.upgrade.hover) {
        S.upgrade.hover = hi;
        if (hi >= 0) sfx.uiHover();
      }
    } else if (S.mode === 'select') {
      var mh = menuHit(input.mx, input.my);
      if (mh !== menu.hover) {
        menu.hover = mh;
        if (mh >= 0) sfx.uiHover();
      }
    }
  });

  canvas.addEventListener('mousedown', function (e) {
    if (e.button !== 0) return;
    if (S.mode !== 'dead') startMusic();   // 任意点击解锁 AudioContext（自动播放策略）
    if (S.metaOpen) {
      var mrect = canvas.getBoundingClientRect();
      var mmx = (e.clientX - mrect.left) / mrect.width * W;
      var mmy = (e.clientY - mrect.top) / mrect.height * H;
      var mh = metaHit(mmx, mmy);
      if (mh && mh.type === 'close') { closeMeta(); return; }
      if (mh && mh.type === 'buy') {
        var md = META_DEFS[mh.index];
        if (md && buyMeta(md.id)) sfx.upgradePick();
        else sfx.uiHover();
      }
      return;
    }
    if (S.mode === 'upgrade') {
      var urect = canvas.getBoundingClientRect();
      var umx = (e.clientX - urect.left) / urect.width * W;
      var umy = (e.clientY - urect.top) / urect.height * H;
      var ui = upgradeHit(umx, umy);
      if (ui >= 0) chooseUpgrade(ui);
      return;
    }
    if (S.mode === 'select') {
      var rect = canvas.getBoundingClientRect();
      var mx = (e.clientX - rect.left) / rect.width * W;
      var my = (e.clientY - rect.top) / rect.height * H;
      var mi = menuHit(mx, my);
      if (mi >= 0) { menuAction(mi); return; }
      for (var i = 0; i < SHIP_ORDER.length; i++) {
        var rc = cardRect(i);
        if (mx >= rc.x && mx <= rc.x + rc.w && my >= rc.y && my <= rc.y + rc.h) {
          selectShip(SHIP_ORDER[i]);
          return;
        }
      }
      return;
    }
    input.firing = true;
  });

  window.addEventListener('mouseup', function (e) {
    if (e.button === 0) input.firing = false;
  });

  function pauseForBlur() {
    input.up = input.down = input.left = input.right = false;
    input.firing = false;
    if (S.mode === 'playing') {
      S.mode = 'paused';
      duckMusic(true);
      blurPaused = true;
    }
    if (!muted) {
      muted = true;
      applyMute();
      blurMuted = true;
    }
  }

  function resumeAfterBlur() {
    if (blurMuted) {
      muted = false;
      applyMute();
      blurMuted = false;
    }
    if (blurPaused && S.mode === 'paused') {
      S.mode = 'playing';
      duckMusic(false);
      blurPaused = false;
    }
    if (!muted && actx && actx.state === 'suspended') {
      try { actx.resume(); } catch (e) {}
    }
  }

  window.addEventListener('blur', pauseForBlur);
  window.addEventListener('focus', resumeAfterBlur);

  document.addEventListener('visibilitychange', function () {
    if (document.hidden) pauseForBlur();
    else resumeAfterBlur();
  });

  document.addEventListener('fullscreenchange', fit);

  window.addEventListener('resize', fit);

  // ===== 启动 =====
  reset('striker', 'select');
  fit();
  requestAnimationFrame(frame);

  // 调试 / 无头测试入口（原型允许保留）
  window.__ARCADE__ = {
    S: S, CFG: CFG, W: W, H: H, input: input,
    reset: reset, update: update, updateDeath: updateDeath, updateIntro: updateIntro,
    returnToSelect: returnToSelect, shoot: shoot, render: render,
    menuRects: menuRects, menuHit: menuHit, menuAction: menuAction,
    pauseForBlur: pauseForBlur, resumeAfterBlur: resumeAfterBlur,
    syncCursor: syncCursor, isCursorHidden: function () { return cursorHidden; },
    isMuted: function () { return muted; }, getBest: function () { return best; },
    submitBest: submitBest, loadBest: loadBest, bestHash: bestHash,
    meta: meta, META_DEFS: META_DEFS, metaCost: metaCost,
    buyMeta: buyMeta, saveMeta: saveMeta,
    openMeta: openMeta, closeMeta: closeMeta,
    playerDpsEstimate: playerDpsEstimate,
    spawnBoss: spawnBoss, damageBoss: damageBoss, fireBossRing: fireBossRing,
    applyUpgrade: applyUpgrade, chooseUpgrade: chooseUpgrade, rollUpgrades: rollUpgrades,
    updateUpgrade: updateUpgrade, updateReward: updateReward, updateEvolution: updateEvolution,
    switchEvoForm: switchEvoForm, updateFusion: updateFusion, rollWaveAffixes: rollWaveAffixes,
    updateAffixEffects: updateAffixEffects, progress: progress, runUnlocks: runUnlocks,
    nextRunNo: nextRunNo, pickupAllowed: pickupAllowed, RUN_INFO: RUN_INFO,
    UPGRADE_DEFS: UPGRADE_DEFS,
    spawnEnemy: spawnEnemy, killEnemy: killEnemy, hurtPlayer: hurtPlayer,
    selectShip: selectShip, spawnPickup: spawnPickup, collectPickup: collectPickup,
    ships: CFG.ships, weapons: CFG.weapons, pickupInfo: CFG.pickupInfo,
    fireInterval: fireInterval, pellets: pellets, damage: damage, spread: spread,
    renderStats: renderStats,
    story: story, STORY_LINES: STORY_LINES, showStory: showStory,
    pools: { caps: POOL_CAP, stats: poolStats, free: pools },
    grid: {
      cell: GRID_CELL, margin: GRID_MARGIN, cols: GRID_W, rows: GRID_H, stats: gridStats,
      build: gridBuild,
      // 3×3 邻域查询（结果做精确半径过滤）；r 应 ≤ 64，才是完整候选集
      query: function (x, y, r) {
        gridBuild();
        var out = [], cand = gridNear(x, y, []);
        var rr = r === undefined ? 64 : r, r2 = rr * rr;
        for (var i = 0; i < cand.length; i++) {
          var e = cand[i], dx = e.x - x, dy = e.y - y;
          if (dx * dx + dy * dy <= r2) out.push(e);
        }
        return out;
      },
      // 暴力查询（测试对照用）
      brute: function (x, y, r) {
        var out = [], rr = r === undefined ? 64 : r, r2 = rr * rr;
        for (var i = 0; i < S.enemies.length; i++) {
          var e = S.enemies[i], dx = e.x - x, dy = e.y - y;
          if (dx * dx + dy * dy <= r2) out.push(e);
        }
        return out;
      }
    },
    audio: {
      ensure: ensureAudio,
      start: startMusic,
      stop: stopMusic,
      isPlaying: function () { return music.on; },
      tier: function () { return musicTier(S.combo); },
      bossWanted: function () { return bossMusic.wanted; },
      bossBpm: function () { return bossMusic.bpm; },
      bossTargets: function () {
        return {
          drums: bossMusic.targets.drums, bass: bossMusic.targets.bass,
          pad: bossMusic.targets.pad, siren: bossMusic.targets.siren
        };
      },
      bossIntense: function () { return bossMusic.intense; },
      targets: function () {
        return {
          drums: music.targets.drums, hats: music.targets.hats,
          bass: music.targets.bass, lead: music.targets.lead
        };
      },
      pitch: shootPitch,
      bpm: function () { return BPM; }
    }
  };
})();
</script>
</body>
