  var SHIP_ORDER = ['striker', 'vector', 'titan'];

  // 强化池：四个颜色流派 + 品质 + 递减叠加（防止无限叠伤一枪秒 Boss）
  var FAMILY = {
    yellow: { name: '火力', color: '#ffd45e' },
    pink:   { name: '重炮', color: '#ff6fae' },
    green:  { name: '生存', color: '#6dffb0' },
    blue:   { name: '奇点', color: '#5ee8ff' }
  };
  var QUALITY = ['I', 'II', 'III', 'IV'];
  var DMG_STEPS = [0.25, 0.18, 0.12, 0.08];
  var RATE_STEPS = [0.84, 0.87, 0.90, 0.93];
  var SPEED_STEPS = [1.12, 1.08, 1.05];
  var MAGNET_STEPS = [1.6, 1.35];
  var COMBO_STEPS = [1.5, 1.3];
  var BULLET_STEPS = [1.2, 1.1];

  var UPGRADE_DEFS = [
    { id: 'double', name: '双发弹幕', family: 'yellow', max: 3, desc: '所有武器额外 +1 发',
      apply: function () { S.upgrades.shots += 1; } },
    { id: 'rate', name: '过载射速', family: 'yellow', max: 4,
      desc: function (n) { return '射击间隔 \u2212' + Math.round((1 - RATE_STEPS[n]) * 100) + '%'; },
      apply: function (n) { S.upgrades.rate *= RATE_STEPS[n]; } },
    { id: 'bulletSpeed', name: '加速弹道', family: 'yellow', max: 2,
      desc: function (n) { return '弹速 +' + Math.round((BULLET_STEPS[n] - 1) * 100) + '%'; },
      apply: function (n) { S.upgrades.bulletSpeed *= BULLET_STEPS[n]; } },
    { id: 'damage', name: '高能弹头', family: 'pink', max: 4,
      desc: function (n) { return '伤害 +' + Math.round(DMG_STEPS[n] * 100) + '%'; },
      apply: function (n) { S.upgrades.dmg *= 1 + DMG_STEPS[n]; } },
    { id: 'pierce', name: '贯穿协议', family: 'pink', max: 1, unique: true,
      desc: '所有子弹获得穿透',
      owned: function () { return S.upgrades.pierce; },
      apply: function () { S.upgrades.pierce = true; } },
    { id: 'hp', name: '结构加固', family: 'green', max: 4, desc: '生命上限 +1，回复 1 点',
      apply: function () {
        S.upgrades.hpBonus += 1;
        S.player.maxHp += 1;
        S.player.hp = Math.min(S.player.maxHp, S.player.hp + 1);
      } },
    { id: 'magnet', name: '磁力回收', family: 'green', max: 2,
      desc: function (n) { return '拾取范围 +' + Math.round((MAGNET_STEPS[n] - 1) * 100) + '%'; },
      apply: function (n) { S.upgrades.magnet *= MAGNET_STEPS[n]; } },
    { id: 'lifesteal', name: '纳米回收', family: 'green', max: 2,
      desc: function (n) { return '击杀有 ' + ((n + 1) * 10) + '% 概率回复 1 点生命'; },
      apply: function () { S.upgrades.lifesteal += 1; } },
    { id: 'core', name: '能量核心', family: 'green', max: 3,
      desc: function (n) { return '融合上限 +' + CFG.fusion.coreCap + '，立即回能 35'; },
      apply: function () {
        S.upgrades.core += 1;
        var cap = fusionCap(), mats = S.evoMats[S.evolved];
        if (mats) for (var i = 0; i < mats.length; i++) {

    { id: 'chain', name: '电弧跃迁', family: 'blue', max: 2,

  var COL = {

  function clamp(v, lo, hi) { return v < lo ? lo : v > hi ? hi : v; }

  // ===== 状态 =====
  var S = {
    mode: 'playing',
    ship: 'striker',
    slow: 0,
    time: 0, elapsed: 0,
    score: 0, kills: 0, maxCombo: 0,
    combo: 0, comboTimer: 0, comboPop: 0,
    trauma: 0, hitStop: 0, hurtFlash: 0,
    deathT: 0, deathReport: null,
    introT: 0, selectT: 1,
    runNo: 0, selectNotice: '', selectNoticeT: 0, metaJustUnlocked: false,

    affixBlasts: [], affixGhosts: [], affixLinks: [],

    victoryFlash: 0,
    upgrade: null,
    upgrades: null,
    metaOpen: false, metaHover: -1, shardsEarned: 0,
    wingCount: 1, wingLevel: 1, wings: [],

    evoTier: 1, evoMats: {}, energyBank: 0, lastBaseWeapon: 'pulse', bossRefundArmed: false,

    player: null,
    bullets: [], enemies: [], sparks: [], chunks: [], rings: [], floats: [], pickups: []

  var input = { up: false, down: false, left: false, right: false, firing: false, mx: W / 2, my: H / 2 };

  // ===== 最高分存档：版本 + 完整性校验 + 上限 + 异常兜底 =====
  // 注意：纯前端无法做到真正防作弊；这里只阻止手改明文/异常值，排行榜需服务端校验。
  var BEST_KEY = 'neon-swarm-best-v2';
  var BEST_OLD_KEY = 'neon-swarm-best';
  var BEST_MAX = 9999999;
  var BEST_SECRET = 'neon-swarm::score::v2::7f3a';
  var best = 0;

  function bestHash(score) {
    var s = BEST_SECRET + '|' + score + '|' + BEST_SECRET;
    var h = 2166136261;
    for (var i = 0; i < s.length; i++) {
      h ^= s.charCodeAt(i);
      h = Math.imul(h, 16777619);
    }
    return (h >>> 0).toString(36);
  }

  function loadBest() {
    var loaded = 0;
    try {
      var raw = window.localStorage.getItem(BEST_KEY);
      if (raw) {
        var obj = JSON.parse(raw);
        if (obj && obj.v === 2 && Number.isSafeInteger(obj.score) &&
            obj.score >= 0 && obj.score <= BEST_MAX && obj.sig === bestHash(obj.score)) {
          loaded = obj.score;
        } else {
          try { window.localStorage.removeItem(BEST_KEY); } catch (e2) {}
        }
      } else {
        // 旧版明文最高分：只在合法范围内迁移
        var old = parseInt(window.localStorage.getItem(BEST_OLD_KEY) || '', 10);
        if (Number.isSafeInteger(old) && old >= 0 && old <= BEST_MAX) {
          loaded = old;
          best = old;
          saveBest();
        }
      }
    } catch (e) { loaded = 0; }
    best = Number.isSafeInteger(loaded) && loaded >= 0 ? Math.min(loaded, BEST_MAX) : 0;
  }

  function saveBest() {
    if (!Number.isSafeInteger(best) || best < 0) best = 0;
    best = Math.min(best, BEST_MAX);
    try {
      window.localStorage.setItem(BEST_KEY, JSON.stringify({
        v: 2, score: best, sig: bestHash(best)
      }));
    } catch (e) {}
  }

  function submitBest(score) {
    if (!Number.isFinite(score)) return false;
    score = Math.floor(score);
    if (score <= 0 || score > BEST_MAX) return false;
    if (score > best) {
      best = score;
      saveBest();
      return true;
    }
    return false;
  }

  loadBest();

  // ===== 局外成长：数据碎片 / 永久强化（localStorage）=====
  var META_VERSION = 2;
  var META_DEFS = [
    { id: 'hp', name: '机体冗余', desc: '初始生命上限 +1', max: 3, baseCost: 1, color: '#6dffb0' },
    { id: 'dmg', name: '火控校准', desc: '初始伤害 +8%', max: 5, baseCost: 1, color: '#ff6fae' },
    { id: 'speed', name: '推进器调校', desc: '移动速度 +5%', max: 4, baseCost: 1, color: '#5ee8ff' },
    { id: 'wing', name: '僚机授权', desc: '开局额外 +1 架僚机', max: 2, baseCost: 5, color: '#b98cff' }
  ];
  var meta = { version: META_VERSION, shards: 0, hp: 0, dmg: 0, speed: 0, wing: 0 };
  try {
    var mRaw = JSON.parse(window.localStorage.getItem('neon-swarm-meta') || 'null');
    // v2 经济：旧档按普通击杀给碎片，数值已失控；一次性重置为新经济
    if (mRaw && mRaw.version === META_VERSION) {
      meta.shards = Math.max(0, Math.floor(mRaw.shards || 0));
      for (var mi = 0; mi < META_DEFS.length; mi++) {
        var md = META_DEFS[mi];
        meta[md.id] = clamp(Math.floor(mRaw[md.id] || 0), 0, md.max);
      }
    }
  } catch (e) { meta = { version: META_VERSION, shards: 0, hp: 0, dmg: 0, speed: 0, wing: 0 }; }
  if (typeof mRaw !== 'undefined' && mRaw && mRaw.version !== META_VERSION) saveMeta();

  function metaDef(id) {
    for (var i = 0; i < META_DEFS.length; i++) if (META_DEFS[i].id === id) return META_DEFS[i];
    return null;
  }
  function metaCost(def) { return def.baseCost * (meta[def.id] + 1); }
  function saveMeta() {
    try { window.localStorage.setItem('neon-swarm-meta', JSON.stringify(meta)); } catch (e) {}
  }
  function buyMeta(id) {
    var d = metaDef(id);
    if (!d || meta[id] >= d.max) return false;
    var cost = metaCost(d);
    if (meta.shards < cost) return false;
    meta.shards -= cost;
    meta[id] += 1;
    saveMeta();
    return true;
  }

  // ===== 新手引导 / 渐进式解锁（localStorage 局数）=====
  var PROGRESS_KEY = 'neon-swarm-progress-v1';
  var progress = { version: 1, runs: 0, metaUnlocked: false };
  var progressLoaded = false;
  try {
    var pRaw = JSON.parse(window.localStorage.getItem(PROGRESS_KEY) || 'null');
    if (pRaw && pRaw.version === 1) {
      progress.runs = Math.max(0, Math.min(9999, Math.floor(pRaw.runs || 0)));
      progress.metaUnlocked = !!pRaw.metaUnlocked;
      progressLoaded = true;
    }
  } catch (eP) {}
  // 老玩家已有局外升级：直接视为已解锁，避免被新引导锁死
  if (!progressLoaded && (meta.shards > 0 || meta.hp > 0 || meta.dmg > 0 || meta.speed > 0 || meta.wing > 0)) {
    progress.metaUnlocked = true;

  // 敌人之间的轻推分离也走同一网格，替代原来的 O(E²) 全遍历。
  var GRID_CELL = 64, GRID_MARGIN = 128;

  function gridBuild() {

      noiseBurst(0.18, 0.08, 1200);
    },
    phase: function () {
      var ac = ensureAudio(); if (!ac) return;
      var t = ac.currentTime;
      tone('sine', 1400, 2200, 0.08, 0.03, t);
      noiseBurstTo(master, t, 0.08, 0.02, 7000);
    },
    wingLevel: function () {
      var ac = ensureAudio(); if (!ac) return;
      var t = ac.currentTime;
      tone('sine', 880, 1320, 0.18, 0.04, t);
      tone('sine', 1320, 1760, 0.22, 0.03, t + 0.1);
    },
    bossVictory: function () {
      var ac = ensureAudio(); if (!ac) return;
      var t = ac.currentTime;
      tone('sine', 60, 30, 0.8, 0.16, t);                 // 低频收束
      tone('sine', 220, 880, 0.5, 0.05, t + 0.05);        // 上升扫描
      tone('sine', 440, 440, 0.5, 0.07, t + 0.35);        // 大三和弦
      tone('sine', 554.37, 554.37, 0.5, 0.06, t + 0.42);
      tone('sine', 659.25, 659.25, 0.8, 0.06, t + 0.49);
      noiseBurstTo(master, t + 0.3, 0.5, 0.05, 6000);     // 高频闪光
    },
    bossDie: function () {
      var ac = ensureAudio(); if (!ac) return;
      var t = ac.currentTime;
      tone('sine', 180, 22, 2.0, 0.24, t);
      noiseBurst(1.6, 0.18, 180);
      noiseBurst(0.8, 0.10, 900);
      tone('sine', 880, 1320, 0.18, 0.06, t + 0.2);
      tone('square', 120, 60, 0.5, 0.05, t + 0.9);
    },
    comboLost: function () { tone('square', 330, 110, 0.16, 0.05); }
  };

  // ----- 自适应音乐：120 BPM，四层随连击叠加，层增益平滑过渡 -----
  var BPM = 120;
  var music = {
    on: false, gain: null, filter: null, timer: null, fadeTimer: 0, step: 0, next: 0,
    layers: null, dist: null, leadFilter: null, padFilter: null,
    delay: null, wet: null, fb: null,
    targets: { drums: 1, hats: 0, bass: 0, lead: 0 }
  };
  // Boss 专属音乐：140 BPM，A 小调 + 三全音 D#；随 Boss 血量分层
  var bossMusic = {
    on: false, wanted: false, gain: null, filter: null, layers: null,
    timer: null, step: 0, next: 0, bpm: 140, intense: false,
    targets: { drums: 1, bass: 1, pad: 0.8, siren: 0 }
  };
  var BOSS_BASS = [55, -1, 55, 65.41, -1, 55, 73.42, 55, 49, -1, 49, 58.27, -1, 49, 65.41, 49];

  var BASS_LINE = [55, -1, 55, -1, 65.41, -1, 55, -1, 49, -1, 49, -1, 58.27, -1, 55, -1];
  // 琶音降八度 + 三角波 + 低通：从"刺耳蜂鸣"变成能听的和声
  var ARP_LINE = [440, 523.25, 659.25, 523.25, 440, 659.25, 880, 659.25,
                  493.88, 587.33, 783.99, 587.33, 493.88, 659.25, 880, 659.25];
  // L4 的铺底和弦：Am → F → G → Am，每小节一个
  var CHORDS = [
    [220.00, 261.63, 329.63],
    [174.61, 220.00, 261.63],
    [196.00, 246.94, 293.66],
    [220.00, 261.63, 329.63]
  ];

  // 连击 → 音乐层级：0=只有鼓；1=+踩镲；2=+贝斯；3=+琶音
  function musicTier(combo) {
    if (combo >= 50) return 3;
    if (combo >= 30) return 2;
    if (combo >= 10) return 1;
    return 0;
  }

  function updateMusicLayers() {
    var tier = musicTier(S.combo);
    music.targets.drums = 1;
    music.targets.hats = tier >= 1 ? 1 : 0;
    music.targets.bass = tier >= 2 ? 1 : 0;
    music.targets.lead = tier >= 3 ? 1 : 0;
    if (!actx || !music.layers) return;
    var now = actx.currentTime;
    for (var k in music.layers) {
      if (!music.layers.hasOwnProperty(k)) continue;
      // 0.45s 时间常数：连击断裂时平滑降级，不会被突然掐断
      music.layers[k].gain.setTargetAtTime(music.targets[k], now, 0.45);
    }
  }

  function kickAt(t) {
    try {
      var o = actx.createOscillator(), g = actx.createGain();
      o.type = 'sine';
      o.frequency.setValueAtTime(150, t);
      o.frequency.exponentialRampToValueAtTime(42, t + 0.13);
      g.gain.setValueAtTime(0.0001, t);
      g.gain.linearRampToValueAtTime(0.5, t + 0.004);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.16);
      o.connect(g); g.connect(music.layers.drums);
      o.start(t); o.stop(t + 0.18);
    } catch (e) {}
  }

  function hatAt(t) {
    noiseBurstTo(music.layers.hats, t, 0.028, 0.045, 6500);
  }

  function bassAt(t, f) {
    try {
      var o = actx.createOscillator(), lp = actx.createBiquadFilter(), g = actx.createGain();
      o.type = 'sawtooth';
      o.frequency.setValueAtTime(f, t);
      lp.type = 'lowpass'; lp.frequency.setValueAtTime(480, t); lp.Q.value = 8;
      g.gain.setValueAtTime(0.0001, t);
      g.gain.linearRampToValueAtTime(0.18, t + 0.01);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.16);
      o.connect(lp); lp.connect(g); g.connect(music.layers.bass);
      o.start(t); o.stop(t + 0.16);
    } catch (e) {}
  }

  function leadAt(t, f) {
    try {
      var o = actx.createOscillator(), g = actx.createGain();
      o.type = 'triangle';
      o.frequency.setValueAtTime(f, t);
      g.gain.setValueAtTime(0.0001, t);
      g.gain.linearRampToValueAtTime(0.075, t + 0.012);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.14);
      o.connect(g); g.connect(music.leadFilter);
      o.start(t); o.stop(t + 0.16);
    } catch (e) {}
  }

  // 每小节一个铺底和弦：慢起慢落，把琶音"托"成一首曲子
  function padAt(t, bar) {
    try {
      var chord = CHORDS[bar % CHORDS.length];
      var g = actx.createGain();
      g.gain.setValueAtTime(0.0001, t);
      g.gain.linearRampToValueAtTime(0.05, t + 0.3);
      g.gain.setValueAtTime(0.05, t + 1.6);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 2.1);
      g.connect(music.padFilter);
      for (var i = 0; i < chord.length; i++) {
        var o = actx.createOscillator();
        o.type = 'triangle';
        o.frequency.setValueAtTime(chord[i], t);
        o.detune.setValueAtTime((i - 1) * 5, t);
        o.connect(g);
        o.start(t);
        o.stop(t + 2.15);
      }
    } catch (e) {}
  }

  function scheduleMusic() {
    var ac = actx;
    if (!ac || !music.on || !music.layers) return;
    var stepDur = 60 / BPM / 4;   // 16 分音符
    while (music.next < ac.currentTime + 0.15) {
      var s = music.step % 16, t = music.next, combo = S.combo;
      if (s % 4 === 0) kickAt(t);                     // 4/4 底鼓：游戏的心跳
      if (s % 4 === 2) hatAt(t);                      // 8 分踩镲（连击 ≥10 才听得到）
      if (combo >= 50 && s % 2 === 1) hatAt(t);       // 暴走：加密到 16 分
      if (BASS_LINE[s] > 0) bassAt(t, BASS_LINE[s]);  // 贝斯（连击 ≥30 才听得到）
      if (s % 2 === 0) leadAt(t, ARP_LINE[s]);        // 8 分琶音（连击 ≥50 才听得到）
      if (s === 0) padAt(t, Math.floor(music.step / 16)); // 每小节铺底和弦
      music.step++;
      music.next += stepDur;
    }
  }

  function startMusic() {
    var ac = ensureAudio();
    if (!ac || music.on) return;
    music.on = true;
    if (!music.gain) {
      music.gain = ac.createGain();
      // 总线低通：死亡时从 12kHz 扫到 300Hz，做"断电下沉"的过渡
      music.filter = ac.createBiquadFilter();
      music.filter.type = 'lowpass';
      music.filter.frequency.value = 12000;
      music.filter.Q.value = 0.3;
      music.gain.connect(music.filter);
      music.filter.connect(master);
      // 旋律层专用短延迟：给音乐一点空间感，同时不糊掉鼓点
      music.delay = ac.createDelay(0.5);
      music.delay.delayTime.value = 0.17;
      music.fb = ac.createGain();
      music.fb.gain.value = 0.20;
      music.wet = ac.createGain();
      music.wet.gain.value = 0.14;
      music.delay.connect(music.fb);
      music.fb.connect(music.delay);
      music.delay.connect(music.wet);
      music.wet.connect(music.gain);   // 延迟返送也受整体音量/duck 控制
    }
    if (!music.layers) {
      music.layers = {};
      var names = ['drums', 'hats', 'bass', 'lead'], i, g;
      for (i = 0; i < names.length; i++) {
        g = ac.createGain();
        g.gain.value = 0;
        g.connect(music.gain);
        music.layers[names[i]] = g;
      }
      // 琶音：低通 + 轻度饱和，去掉刺耳的高频
      music.leadFilter = ac.createBiquadFilter();
      music.leadFilter.type = 'lowpass';
      music.leadFilter.frequency.value = 2400;
      music.leadFilter.Q.value = 0.6;
      music.dist = ac.createWaveShaper();
      music.dist.curve = distortionCurve(25);
      music.dist.oversample = '2x';
      music.leadFilter.connect(music.dist);
      music.dist.connect(music.layers.lead);
      // 铺底和弦：更暖的低通
      music.padFilter = ac.createBiquadFilter();
      music.padFilter.type = 'lowpass';
      music.padFilter.frequency.value = 1200;
      music.padFilter.Q.value = 0.5;
      music.padFilter.connect(music.layers.lead);
      music.layers.lead.connect(music.delay);
      music.layers.drums.gain.value = 1;
    }
    if (music.fadeTimer) { clearTimeout(music.fadeTimer); music.fadeTimer = 0; }
    if (music.filter) {
      music.filter.frequency.cancelScheduledValues(ac.currentTime);
      music.filter.frequency.setValueAtTime(12000, ac.currentTime);
    }
    music.gain.gain.cancelScheduledValues(ac.currentTime);
    music.gain.gain.setValueAtTime(0.0001, ac.currentTime);
    music.gain.gain.linearRampToValueAtTime(0.38, ac.currentTime + 1.2);
    music.step = 0;
    music.next = ac.currentTime + 0.1;
    updateMusicLayers();
    if (music.timer) clearInterval(music.timer);
    music.timer = setInterval(scheduleMusic, 25);
    scheduleMusic();
  }

  function stopMusic() {
    music.on = false;
    if (music.timer) { clearInterval(music.timer); music.timer = null; }
    if (music.fadeTimer) { clearTimeout(music.fadeTimer); music.fadeTimer = 0; }
    bossMusic.on = false;
    bossMusic.wanted = false;
    if (bossMusic.timer) { clearInterval(bossMusic.timer); bossMusic.timer = null; }
    if (actx) {
      if (music.gain) music.gain.gain.setTargetAtTime(0.0001, actx.currentTime, 0.4);
      if (bossMusic.gain) bossMusic.gain.gain.setTargetAtTime(0.0001, actx.currentTime, 0.4);
    }
  }

  // 死亡收场：音乐在 sec 秒内低通下沉 + 淡出，结束后再停调度器
  function fadeOutMusic(sec) {
    if (!actx || !music.gain) return;
    var t = actx.currentTime;
    if (music.gain.gain.cancelAndHoldAtTime) music.gain.gain.cancelAndHoldAtTime(t);
    else music.gain.gain.cancelScheduledValues(t);
    music.gain.gain.setValueAtTime(Math.max(0.0001, music.gain.gain.value), t);
    music.gain.gain.exponentialRampToValueAtTime(0.0001, t + sec);
    if (music.filter) {
      if (music.filter.frequency.cancelAndHoldAtTime) music.filter.frequency.cancelAndHoldAtTime(t);
      else music.filter.frequency.cancelScheduledValues(t);
      music.filter.frequency.setValueAtTime(Math.max(300, music.filter.frequency.value), t);
      music.filter.frequency.exponentialRampToValueAtTime(300, t + sec);
    }
    if (music.fadeTimer) clearTimeout(music.fadeTimer);
    // Boss 音乐一起淡出并停止调度
    bossMusic.on = false;
    bossMusic.wanted = false;
    if (bossMusic.timer) { clearInterval(bossMusic.timer); bossMusic.timer = null; }
    if (bossMusic.gain) bossMusic.gain.gain.setTargetAtTime(0.0001, t, 0.4);
    music.fadeTimer = setTimeout(function () {
      music.fadeTimer = 0;
      if (music.on) stopMusic();
      if (actx && music.filter) {
        music.filter.frequency.setTargetAtTime(12000, actx.currentTime, 0.3);
      }
    }, Math.max(0, sec * 1000));
  }

  function duckMusic(down) {
    if (!actx) return;
    var t = actx.currentTime;
    if (music.gain) {
      music.gain.gain.setTargetAtTime(down ? 0.05 : (bossMusic.wanted ? 0.0001 : 0.38), t, 0.25);
    }
    if (bossMusic.gain) {
      bossMusic.gain.gain.setTargetAtTime(down ? 0.05 : (bossMusic.wanted ? 0.40 : 0.0001), t, 0.25);
    }
  }

  function applyMute() {
    if (master && actx) master.gain.setTargetAtTime(muted ? 0 : 0.9, actx.currentTime, 0.05);
  }

  // ===== Boss 专属 BGM：140 BPM，工业鼓 + A 小调贝斯 + 三全音铺底 + 警笛 -----
  function ensureBossNodes() {
    var ac = actx;
    if (!ac || bossMusic.gain) return;
    bossMusic.gain = ac.createGain();
    bossMusic.gain.gain.value = 0.0001;
    bossMusic.filter = ac.createBiquadFilter();
    bossMusic.filter.type = 'lowpass';
    bossMusic.filter.frequency.value = 6000;
    bossMusic.filter.Q.value = 0.4;
    bossMusic.gain.connect(bossMusic.filter);
    bossMusic.filter.connect(master);
    bossMusic.layers = {};
    var names = ['drums', 'bass', 'pad', 'siren'], i, g;
    for (i = 0; i < names.length; i++) {
      g = ac.createGain();
      g.gain.value = 0;
      g.connect(bossMusic.gain);
      bossMusic.layers[names[i]] = g;
    }
    bossMusic.layers.drums.gain.value = 1;
    bossMusic.layers.bass.gain.value = 1;
    bossMusic.layers.pad.gain.value = 0.8;
  }

  function bossKickAt(t) {
    try {
      var o = actx.createOscillator(), g = actx.createGain();
      o.type = 'sine';
      o.frequency.setValueAtTime(140, t);
      o.frequency.exponentialRampToValueAtTime(38, t + 0.16);
      g.gain.setValueAtTime(0.0001, t);
      g.gain.linearRampToValueAtTime(0.55, t + 0.004);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.18);
      o.connect(g); g.connect(bossMusic.layers.drums);
      o.start(t); o.stop(t + 0.2);
    } catch (e) {}
  }

  function bossHatAt(t) {
    noiseBurstTo(bossMusic.layers.drums, t, 0.025, 0.035, 8500);
  }

  function bossSnareAt(t) {
    noiseBurstTo(bossMusic.layers.drums, t, 0.10, 0.11, 1400);
    try {
      var o = actx.createOscillator(), g = actx.createGain();
      o.type = 'square';
      o.frequency.setValueAtTime(190, t);
      o.frequency.exponentialRampToValueAtTime(90, t + 0.05);
      g.gain.setValueAtTime(0.0001, t);
      g.gain.linearRampToValueAtTime(0.03, t + 0.004);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.06);
      o.connect(g); g.connect(bossMusic.layers.drums);
      o.start(t); o.stop(t + 0.08);
    } catch (e) {}
  }

  function bossBassAt(t, f) {
    try {
      var o = actx.createOscillator(), lp = actx.createBiquadFilter(), g = actx.createGain();
      o.type = 'sawtooth';
      o.frequency.setValueAtTime(f, t);
      lp.type = 'lowpass'; lp.frequency.value = 380; lp.Q.value = 7;
      g.gain.setValueAtTime(0.0001, t);
      g.gain.linearRampToValueAtTime(0.16, t + 0.008);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.13);
      o.connect(lp); lp.connect(g); g.connect(bossMusic.layers.bass);
      o.start(t); o.stop(t + 0.15);
    } catch (e) {}
  }

  function bossPadAt(t) {
    try {
      var g = actx.createGain(), lp = actx.createBiquadFilter();
      g.gain.setValueAtTime(0.0001, t);
      g.gain.linearRampToValueAtTime(0.025, t + 0.35);
      g.gain.setValueAtTime(0.025, t + 1.45);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 1.9);
      lp.type = 'lowpass'; lp.frequency.value = 700; lp.Q.value = 0.5;
      lp.connect(g); g.connect(bossMusic.layers.pad);
      var freqs = [110, 155.56];   // A2 + D#3 三全音
      for (var i = 0; i < freqs.length; i++) {
        var o = actx.createOscillator();
        o.type = 'sawtooth';
        o.frequency.setValueAtTime(freqs[i], t);
        o.detune.setValueAtTime(i === 0 ? -6 : 6, t);
        o.connect(lp);
        o.start(t); o.stop(t + 1.95);
      }
    } catch (e) {}
  }

  function bossSirenAt(t) {
    try {
      var o = actx.createOscillator(), g = actx.createGain();
      o.type = 'sine';
      o.frequency.setValueAtTime(430, t);
      o.frequency.linearRampToValueAtTime(650, t + 0.35);
      o.frequency.linearRampToValueAtTime(430, t + 0.75);
      g.gain.setValueAtTime(0.0001, t);
      g.gain.linearRampToValueAtTime(0.045, t + 0.06);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.9);
      o.connect(g); g.connect(bossMusic.layers.siren);
      o.start(t); o.stop(t + 0.95);
    } catch (e) {}
  }

  function scheduleBossMusic() {
    var ac = actx;
    if (!ac || !bossMusic.on || !bossMusic.layers) return;
    var stepDur = 60 / bossMusic.bpm / 4;
    while (bossMusic.next < ac.currentTime + 0.15) {
      var s = bossMusic.step % 16, t = bossMusic.next;
      var bar = Math.floor(bossMusic.step / 16);
      if (s % 4 === 0) bossKickAt(t);
      if (bossMusic.intense && s === 14) bossKickAt(t);
      if (s === 4 || s === 12) bossSnareAt(t);
      if (s % 2 === 0) bossHatAt(t);
      if (bossMusic.intense && s % 2 === 1) bossHatAt(t);
      var b = BOSS_BASS[s];
      if (b > 0) bossBassAt(t, b);
      if (s === 0) {
        bossPadAt(t);
        if (bar % 2 === 0) bossSirenAt(t);
      }
      bossMusic.step++;
      bossMusic.next += stepDur;
    }
  }

  function startBossMusic() {
    bossMusic.wanted = true;
    // 不在无交互时创建 AudioContext：战斗音乐总是跟随已解锁的宿主音频
    if (!actx || !master) return;
    var ac = actx;
    ensureBossNodes();
    if (bossMusic.on) return;
    bossMusic.on = true;
    bossMusic.step = 0;
    bossMusic.next = ac.currentTime + 0.08;
    updateBossMusic();
    var t = ac.currentTime;
    bossMusic.gain.gain.cancelScheduledValues(t);
    bossMusic.gain.gain.setValueAtTime(0.0001, t);
    bossMusic.gain.gain.setTargetAtTime(0.40, t, 0.35);
    if (music.gain) music.gain.gain.setTargetAtTime(0.0001, t, 0.3);
    if (bossMusic.timer) clearInterval(bossMusic.timer);
    bossMusic.timer = setInterval(scheduleBossMusic, 25);
    scheduleBossMusic();
  }

  function stopBossMusic() {
    bossMusic.wanted = false;
    bossMusic.on = false;
    if (bossMusic.timer) { clearInterval(bossMusic.timer); bossMusic.timer = null; }
    if (!actx) return;
    var t = actx.currentTime;
    if (bossMusic.gain) bossMusic.gain.gain.setTargetAtTime(0.0001, t, 0.4);
    if (music.on && music.gain) music.gain.gain.setTargetAtTime(0.38, t, 0.5);
  }

  function updateBossMusic() {
    if (!S.boss) {
      bossMusic.targets.siren = 0;
      bossMusic.intense = false;
      return;
    }
    var ratio = S.boss.maxHp > 0 ? S.boss.hp / S.boss.maxHp : 1;
    bossMusic.targets.drums = 1;
    bossMusic.targets.bass = 1;
    bossMusic.targets.pad = 0.8;
    bossMusic.targets.siren = ratio <= 0.55 ? 1 : 0;
    bossMusic.intense = ratio <= 0.25;
    if (!actx || !bossMusic.layers) return;
    var now = actx.currentTime;
    for (var k in bossMusic.layers) {
      if (!bossMusic.layers.hasOwnProperty(k)) continue;
      bossMusic.layers[k].gain.setTargetAtTime(bossMusic.targets[k], now, 0.4);
    }
  }

  // ===== 机型 / 枪型 取值 =====
  function ship() { return CFG.ships[S.ship]; }
  function weapon() { return CFG.weapons[S.player ? S.player.weapon : 'pulse']; }

  // ===== 火力曲线（Combo → 射速 / 弹丸 / 伤害；再乘机型与枪型系数）=====
  function fireInterval() {
    var w = weapon(), it;
    if (w.constant) {
      it = w.base;   // LANCE：恒定射速，不受 Combo 影响
    } else {
      var pulse = clamp(CFG.fire.base - S.combo * CFG.fire.perCombo, CFG.fire.min, CFG.fire.base);
      it = pulse / CFG.fire.base * w.base;
    }
    it /= ship().fire;
    if (S.upgrades) it *= S.upgrades.rate;
    if (S.player && S.player.over > 0) it *= 0.65;
    return it;
  }
  function pellets() {
    var w = weapon();
    var base = w.pellets ? w.pellets : (S.combo >= CFG.fire.pellets3 ? 3 : S.combo >= CFG.fire.pellets2 ? 2 : 1);
    if (w.evolved === 'prism' || w.evolved === 'judgment' || w.evolved === 'pulsar') {
      base += (S.evoTier - 1);
    }
    return base + (S.upgrades ? S.upgrades.shots : 0);
  }
  function damage() {
    var d = (CFG.fire.dmgBase + Math.floor(S.combo / 10) * CFG.fire.dmgPer10) * weapon().dmg * ship().dmg;
    if (S.upgrades) d *= S.upgrades.dmg;
    d *= 1 + 0.08 * (progress.metaUnlocked && meta ? meta.dmg : 0);
    if (S.player && S.player.over > 0) d *= 1.3;
    return d;
  }
  function comboWindow() { return CFG.combo.window * (S.upgrades ? S.upgrades.combo : 1); }

  // Boss 血量按当前理论 DPS 拉一个目标 TTK，避免后期构筑成型后秒 Boss
  function playerDpsEstimate() {
    var shot = damage() / fireInterval() * pellets();
    var wing = 0;
    if (S.wingCount > 0) {
      var wd = 1.2 + 0.9 * S.wingLevel;
      var wi = Math.max(0.42, 0.95 - (S.wingLevel - 1) * 0.07);
      wing = S.wingCount * wd / wi;
    }
    return shot + wing;
  }
  function spread() {
    var w = weapon();
    if (w.spread) return w.spread;
    var p = pellets();
    return p >= 3 ? CFG.fire.spread3 : p === 2 ? CFG.fire.spread2 : 0;
  }

    S.shakeX = 0; S.shakeY = 0; S.shakeRot = 0; S.shakeTime = 0;
    S.fireCooldown = 0; S.muzzle = 0; S.spawnTimer = 1.0;

    S.upgrades = {

    S.wingCount = Math.min(3, 1 + (metaOn && meta ? meta.wing : 0));

    S.evolved = null; S.evoForms = []; S.evolution = null; S.evoBanner = 0;
    S.evoTier = 1; S.evoMats = {}; S.energyBank = 0; S.lastBaseWeapon = 'pulse'; S.bossRefundArmed = false;
    S.evoBannerTitle = ''; S.evoBannerSub = '';

  function selectShip(id) {
    if (!CFG.ships[id]) return;
    var planned = S.mode === 'select' ? nextRunNo() : (S.runNo || nextRunNo());
    var u = runUnlocks(planned);
    if (id !== 'striker' && !u.ships) {

  // 部署过渡：1.4s 内画面从黑淡入、镜头从 1.08 拉回 1.0
  function updateIntro(dt) {

  function rollWaveAffixes() {
    S.waveAffixes = [];
    S.affixCursor = 0;
    var u = runUnlocks(S.runNo || 1);
    if (!u.affixes || S.wave < 2) return;
    var ids = Object.keys(CFG.affixes);
    // 第 3 局为词缀教学：每波 1 个；第 4 局起恢复第 4 波 2 个
    var count = (S.runNo >= 4 && S.wave >= 4) ? 2 : 1;
    for (var i = 0; i < count && ids.length; i++) {
      var j = Math.floor(rnd() * ids.length);
      S.waveAffixes.push(ids.splice(j, 1)[0]);
    }
  }

  function affixText() {
    return S.waveAffixes.map(function (id) { return CFG.affixes[id].name; }).join(' · ');
  }

  function spawnEnemy() {
    if (S.enemies.length >= CFG.enemy.cap) return;
    var side = Math.floor(rnd() * 4), m = 24, x, y;
    if (side === 0) { x = rnd() * W; y = -m; }
    else if (side === 1) { x = W + m; y = rnd() * H; }
    else if (side === 2) { x = rnd() * W; y = H + m; }
    else { x = -m; y = rnd() * H; }
    var waveLv = Math.max(0, S.wave - 1);
    var hp = Math.min(CFG.enemy.hpMax + 2,
      1 + Math.floor(S.elapsed / CFG.enemy.hpPerSec) + Math.floor(waveLv / 2));
    var spd = (CFG.enemy.speedMin + Math.min(S.elapsed * CFG.enemy.speedRamp, CFG.enemy.speedMax - CFG.enemy.speedMin))
      * (1 + waveLv * 0.05);
    var affix = null;
    if (S.wave >= 2 && S.wavePhase === 'normal' && S.waveAffixes.length &&
        rnd() < CFG.affix.chance) {
      affix = S.waveAffixes[S.affixCursor % S.waveAffixes.length];
      S.affixCursor += 1;
    }
    if (affix === 'swift') { hp = Math.max(1, Math.round(hp * 0.7)); spd *= 1.5; }
    if (affix === 'armored') { hp = Math.max(1, Math.round(hp * 1.4)); spd *= 0.85; }
    var e = poolTake('enemies', S.enemies);
    e.x = x; e.y = y; e.r = CFG.enemy.r; e.hp = hp; e.maxHp = hp;
    e.spd = spd;
    e.phase = rnd() * TAU; e.flash = 0;
    e.affix = affix; e.affixT = 0; e.splitDepth = 0;
    e.blinkT = 1.6 + rnd() * 1.6; e.buffT = 0; e.buffSpd = 1;
    e.__uid = ++enemyUidSeq; e.__idx = -1;
    if (affix) sparkBurst(x, y, 7, CFG.affixes[affix].color);
  }

  function spawnSplitChildren(e) {
    if (e.splitDepth > 0) return;
    if (S.enemies.length + 2 > CFG.enemy.cap) return;
    var a = Math.atan2(S.player.y - e.y, S.player.x - e.x);
    for (var k = -1; k <= 1; k += 2) {
      var c = poolTake('enemies', S.enemies);
      c.x = clamp(e.x + Math.cos(a + k * 1.1) * e.r * 1.2, 20, W - 20);
      c.y = clamp(e.y + Math.sin(a + k * 1.1) * e.r * 1.2, 20, H - 20);
      c.r = e.r * 0.66;
      c.maxHp = Math.max(1, Math.round(e.maxHp * 0.4));
      c.hp = c.maxHp;
      c.spd = e.spd * 1.15;
      c.phase = rnd() * TAU; c.flash = 0;
      c.affix = null; c.affixT = 0; c.splitDepth = 1;
      c.blinkT = 0; c.buffT = 0; c.buffSpd = 1;
      c.__uid = ++enemyUidSeq; c.__idx = -1;
    }
    sparkBurst(e.x, e.y, 12, '#c9a2ff');
    var rg = poolTake('rings', S.rings);
    rg.x = e.x; rg.y = e.y; rg.r = 8; rg.r1 = 58;
    rg.life = 0.35; rg.max = 0.35; rg.color = '#c9a2ff';

  function spawnAffixField(x, y) {
    if (S.fields.length >= 32) S.fields.shift();
    S.fields.push({
      x: x, y: y, r: CFG.affix.fieldRadius,
      life: CFG.affix.fieldLife, max: CFG.affix.fieldLife
    });
