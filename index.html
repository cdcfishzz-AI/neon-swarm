  function updateAffixFields(dt) {
    for (var i = S.fields.length - 1; i >= 0; i--) {
      S.fields[i].life -= dt;
      if (S.fields[i].life <= 0) S.fields.splice(i, 1);
    }
  }

  function spawnAffixBlast(x, y) {
    if (S.affixBlasts.length >= 20) S.affixBlasts.shift();
    S.affixBlasts.push({ x: x, y: y, r: 74, life: 0.5, max: 0.5 });
  }

  function parasitePulse(e) {
    var count = 0;
    for (var i = 0; i < S.enemies.length && count < 3; i++) {
      var other = S.enemies[i];
      if (other === e || other.hp <= 0) continue;
      var dx = other.x - e.x, dy = other.y - e.y;
      if (dx * dx + dy * dy > 180 * 180) continue;
      other.hp = Math.min(other.maxHp, other.hp + 1);
      other.buffT = 2;
      other.buffSpd = 1.3;
      if (S.affixLinks.length >= 24) S.affixLinks.shift();
      S.affixLinks.push({
        x1: e.x, y1: e.y, x2: other.x, y2: other.y,
        life: 0.4, max: 0.4
      });
      count++;
    }
    sparkBurst(e.x, e.y, 12, '#6dffb0');
    var rg = poolTake('rings', S.rings);
    rg.x = e.x; rg.y = e.y; rg.r = 8; rg.r1 = 82;
    rg.life = 0.35; rg.max = 0.35; rg.color = '#6dffb0';
  }

  function updateAffixEffects(dt) {
    for (var i = S.affixBlasts.length - 1; i >= 0; i--) {
      var b = S.affixBlasts[i];
      b.life -= dt;
      if (b.life <= 0) {
        var p = S.player;
        sparkBurst(b.x, b.y, 18, '#ff8a5c');
        var rg = poolTake('rings', S.rings);
        rg.x = b.x; rg.y = b.y; rg.r = 8; rg.r1 = b.r + 12;
        rg.life = 0.35; rg.max = 0.35; rg.color = '#ff8a5c';
        if (Math.hypot(p.x - b.x, p.y - b.y) < b.r + p.r) hurtPlayer(b);
        sfx.affixBlast();
        S.affixBlasts.splice(i, 1);
      }
    }
    for (var g = S.affixGhosts.length - 1; g >= 0; g--) {
      S.affixGhosts[g].life -= dt;
      if (S.affixGhosts[g].life <= 0) S.affixGhosts.splice(g, 1);
    }
    for (var l = S.affixLinks.length - 1; l >= 0; l--) {
      S.affixLinks[l].life -= dt;
      if (S.affixLinks[l].life <= 0) S.affixLinks.splice(l, 1);
    }
  }

  function sparkBurst(x, y, n, color) {
    for (var i = 0; i < n; i++) {
      var a = rnd() * TAU, sp = 120 + rnd() * 300;
      var s = poolTake('sparks', S.sparks);
      s.x = x; s.y = y; s.vx = Math.cos(a) * sp; s.vy = Math.sin(a) * sp;
      s.life = CFG.fx.sparkLife; s.max = CFG.fx.sparkLife;
      s.size = 2 + rnd() * 2; s.color = color;
    }
  }

  function chunkBurst(x, y, n) {
    for (var i = 0; i < n; i++) {
      var a = rnd() * TAU, sp = 60 + rnd() * 200;
      var c = poolTake('chunks', S.chunks);
      c.x = x; c.y = y; c.vx = Math.cos(a) * sp; c.vy = Math.sin(a) * sp;
      c.rot = rnd() * TAU; c.vr = (rnd() - 0.5) * 12;
      c.life = CFG.fx.chunkLife; c.max = CFG.fx.chunkLife;
      c.size = 4 + rnd() * 3; c.color = COL.chunk;
    }
  }

  function killEnemy(e, award) {
    award = award !== false;
    sparkBurst(e.x, e.y, CFG.fx.killSparks, COL.spark);
    chunkBurst(e.x, e.y, CFG.fx.killChunks);
    var rg = poolTake('rings', S.rings);
    rg.x = e.x; rg.y = e.y; rg.r = 6; rg.r1 = 46;
    rg.life = CFG.fx.ringLife; rg.max = CFG.fx.ringLife; rg.color = COL.ring;
    if (e.affix === 'split') spawnSplitChildren(e);
    if (e.affix === 'magnet') spawnAffixField(e.x, e.y);
    if (e.affix === 'volatile') spawnAffixBlast(e.x, e.y);
    if (e.affix === 'parasitic') parasitePulse(e);
    if (e.affix) sparkBurst(e.x, e.y, 7, CFG.affixes[e.affix].color);
    if (!award) { sparkBurst(e.x, e.y, 6, COL.chunk); return; }
    S.trauma = Math.min(1, S.trauma + CFG.shake.kill);
    S.combo += 1;
    if (S.combo > S.maxCombo) S.maxCombo = S.combo;
    S.comboTimer = comboWindow();
    S.comboPop = 1;
    S.kills += 1;
    S.score += CFG.score.kill + Math.min(S.combo, 50) * CFG.score.perCombo;
    if (S.combo % CFG.shake.milestoneEvery === 0) {
      S.trauma = Math.min(1, S.trauma + CFG.shake.milestone);
      var fl = poolTake('floats', S.floats);
      fl.x = S.player.x; fl.y = S.player.y - 46; fl.text = 'COMBO \u00d7' + S.combo;
      fl.life = 0.9; fl.max = 0.9; fl.vy = -42; fl.size = 22; fl.color = '#ffe27a';
      var rg2 = poolTake('rings', S.rings);
      rg2.x = S.player.x; rg2.y = S.player.y; rg2.r = 10; rg2.r1 = 110;
      rg2.life = 0.5; rg2.max = 0.5; rg2.color = '#ffe27a';
      sfx.milestone();
    }
    if (S.kills % CFG.pickup.pityEvery === 0 || rnd() < CFG.pickup.chance) {
      spawnPickup(null, e.x, e.y);
    }
    if (S.upgrades && S.upgrades.lifesteal > 0 && S.player.hp < S.player.maxHp &&
        rnd() < 0.10 * S.upgrades.lifesteal) {
      S.player.hp += 1;
      var flHeal = poolTake('floats', S.floats);
      flHeal.x = S.player.x; flHeal.y = S.player.y - 44;
      flHeal.text = '+1'; flHeal.life = 0.8; flHeal.max = 0.8;
      flHeal.vy = -36; flHeal.size = 14; flHeal.color = '#6dffb0';
    }
    sfx.kill();
  }

  function steerBullet(b, dt) {
    var best = null, range = 180 + 60 * S.evoTier, bd = range * range, i;
    if (S.boss && S.boss.state === 'active') {
      var bx = S.boss.x - b.x, by = S.boss.y - b.y, bdd = bx * bx + by * by;
      if (bdd < bd) { bd = bdd; best = S.boss; }
    }
    for (i = 0; i < S.enemies.length; i++) {
      var e = S.enemies[i];
      if (e.hp <= 0) continue;
      var dx = e.x - b.x, dy = e.y - b.y, d2 = dx * dx + dy * dy;
      if (d2 < bd) { bd = d2; best = e; }
    }
    if (!best) return;
    var targetA = Math.atan2(best.y - b.y, best.x - b.x);
    var curA = Math.atan2(b.vy, b.vx);
    var diff = Math.atan2(Math.sin(targetA - curA), Math.cos(targetA - curA));
    var rate = (2.4 + 0.8 * S.evoTier) * dt;
    var turn = clamp(diff, -rate, rate);
    var na = curA + turn, sp = Math.hypot(b.vx, b.vy);
    b.vx = Math.cos(na) * sp;
    b.vy = Math.sin(na) * sp;
  }

  function spawnSplit(b) {
    var a = Math.atan2(b.vy, b.vx), sp = Math.hypot(b.vx, b.vy) * 0.85;
    var count = 2 + (S.evoTier - 1);
    for (var k = 0; k < count; k++) {
      var off = (k - (count - 1) / 2) * 0.42;
      var nb = poolTake('bullets', S.bullets);
      nb.x = b.x; nb.y = b.y;
      nb.vx = Math.cos(a + off) * sp;
      nb.vy = Math.sin(a + off) * sp;
      nb.life = 1.1; nb.dmg = b.dmg * (0.45 + 0.1 * S.evoTier); nb.r = 2;
      nb.pierce = false; nb.bossHit = false;
      nb.child = true; nb.splitDone = true; nb.exploded = false;
      nb.bounce = 0; nb.homing = false;
      if (nb.hits) nb.hits.length = 0; else nb.hits = [];
      nb.color = '#ffd45e';
    }
    sfx.split();
  }

  function riftExplode(x, y, dmg, source) {
    var es = S.enemies, i, radius = 60 + 16 * S.evoTier;
    for (i = 0; i < es.length; i++) {
      var e = es[i];
      if (e === source || e.hp <= 0) continue;
      var dx = e.x - x, dy = e.y - y;
      if (dx * dx + dy * dy > radius * radius) continue;
      e.hp -= dmg;
      e.flash = 0.09;
      sparkBurst(e.x, e.y, 5, '#c9a2ff');
      if (e.hp <= 0) killEnemy(e);
    }
    var rg = poolTake('rings', S.rings);
    rg.x = x; rg.y = y; rg.r = 8; rg.r1 = radius + 6;
    rg.life = 0.32; rg.max = 0.32; rg.color = '#c9a2ff';
    S.trauma = Math.min(1, S.trauma + 0.06);
    sfx.rift();
  }

  function tryChain(source) {
    if (!S.upgrades || !S.upgrades.chain) return;
    if (rnd() > 0.14 * S.upgrades.chain) return;
    var best = null, bd = 130 * 130, es = S.enemies;
    for (var i = 0; i < es.length; i++) {
      var e = es[i];
      if (e === source || e.hp <= 0) continue;
      var dx = e.x - source.x, dy = e.y - source.y, d2 = dx * dx + dy * dy;
      if (d2 < bd) { bd = d2; best = e; }
    }
    if (!best) return;
    best.hp -= 1.5 * S.upgrades.chain;
    best.flash = 0.09;
    sparkBurst(best.x, best.y, 6, '#7fe8ff');
    S.chainFx.push({
      x1: source.x, y1: source.y, x2: best.x, y2: best.y,
      life: 0.12, max: 0.12, color: '#7fe8ff'
    });
    if (S.chainFx.length > 12) S.chainFx.shift();
    sfx.chain();
    if (best.hp <= 0) killEnemy(best);
  }

  function hurtPlayer(e) {
    var p = S.player;
    if (p.inv > 0 || p.shield > 0 || S.mode !== 'playing') return;
    var lostCombo = S.combo;
    p.hp -= 1;
    p.inv = CFG.player.iframes;
    S.hitStop = CFG.hitstop.hurt;          // 90ms 顿帧
    S.trauma = Math.min(1, S.trauma + CFG.shake.hurt);
    S.combo = 0; S.comboTimer = 0; S.comboPop = 0;   // 断连击
    S.hurtFlash = CFG.fx.hurtFlash;
    var penalty = Math.min(S.score, CFG.score.hurt); // 扣分惩罚
    S.score -= penalty;
    var dx = p.x - e.x, dy = p.y - e.y, d = Math.hypot(dx, dy) || 1;
    p.x = clamp(p.x + dx / d * CFG.player.hitKnockback, p.r, W - p.r);
    p.y = clamp(p.y + dy / d * CFG.player.hitKnockback, p.r, H - p.r);
    sparkBurst(p.x, p.y, 10, '#ff6b8a');
    var hrg = poolTake('rings', S.rings);
    hrg.x = p.x; hrg.y = p.y; hrg.r = 8; hrg.r1 = 70;
    hrg.life = 0.4; hrg.max = 0.4; hrg.color = '#ff5c86';
    var hfl = poolTake('floats', S.floats);
    hfl.x = p.x; hfl.y = p.y - 34; hfl.text = '-1 HP';
    hfl.life = 0.8; hfl.max = 0.8; hfl.vy = -54; hfl.size = 18; hfl.color = '#ff6b8a';
    if (penalty > 0) {
      var hfl2 = poolTake('floats', S.floats);
      hfl2.x = p.x; hfl2.y = p.y - 12; hfl2.text = '-' + penalty + ' 分';
      hfl2.life = 0.8; hfl2.max = 0.8; hfl2.vy = -44; hfl2.size = 15; hfl2.color = '#ff9a6b';
    }
    if (lostCombo >= 5) {
      var hfl3 = poolTake('floats', S.floats);
      hfl3.x = p.x; hfl3.y = p.y - 58; hfl3.text = 'COMBO LOST';
      hfl3.life = 0.9; hfl3.max = 0.9; hfl3.vy = -40; hfl3.size = 14; hfl3.color = '#ffcf6b';
      sfx.comboLost();
    }
    if (p.hp <= 0) {
      p.hp = 0;
      S.mode = 'dead';
      S.deathT = 0;
      S.deathReport = buildDeathReport();
      S.trauma = 1;
      submitBest(S.score);
      fadeOutMusic(2.2);   // 音乐低通下沉 2.2s 后停
      sfx.powerDown();
    } else {
      sfx.hurt();
    }
  }

  function shoot() {
    var p = S.player, w = weapon(), n = pellets(), sp = spread(), baseA = p.aim;
    var speed = w.speed * (p.over > 0 ? 1.12 : 1) * (S.upgrades ? S.upgrades.bulletSpeed : 1);
    for (var i = 0; i < n; i++) {
      var off = n === 1 ? 0 : (i - (n - 1) / 2) * sp;
      var a = baseA + off;
      var b = poolTake('bullets', S.bullets);
      b.x = p.x + Math.cos(baseA) * (p.r + 5);
      b.y = p.y + Math.sin(baseA) * (p.r + 5);
      b.vx = Math.cos(a) * speed;
      b.vy = Math.sin(a) * speed;
      b.life = w.life;
      b.dmg = damage();
      b.r = w.pierce ? 2 : 3;
      b.pierce = !!w.pierce || !!(S.upgrades && S.upgrades.pierce);
      b.bossHit = false;
      b.child = false; b.splitDone = false; b.exploded = false;
      b.bounce = w.bounce ? w.bounce + (S.evoTier - 1) : 0;
      b.homing = !!w.homing;
      if (b.hits) b.hits.length = 0; else b.hits = [];
      b.color = w.color;
    }
    if (S.evolved) consumeFusionEnergy(CFG.fusion.fireCost);
    // 每次开火最多让 Boss 回一次能：高弹丸/高射速不能无限抵消消耗
    S.bossRefundArmed = !!S.evolved;
    S.fireCooldown = fireInterval();
    S.muzzle = CFG.fx.muzzle;
    sfx.shoot();
  }

  // ===== 掉落物：权重抽取 / 生成 / 拾取 =====
  function pickupAllowed(type) {
    var u = runUnlocks(S.runNo || 1);
    if (type === 'w_spread') return u.spread;
    if (type === 'w_laser') return u.laser;
    return true;
  }

  function pickWeighted() {
    var total = 0, i, t;
    for (i = 0; i < CFG.pickupTable.length; i++) {
      t = CFG.pickupTable[i];
      if (pickupAllowed(t.type)) total += t.weight;
    }
    var r = rnd() * total;
    for (i = 0; i < CFG.pickupTable.length; i++) {
      t = CFG.pickupTable[i];
      if (!pickupAllowed(t.type)) continue;
      r -= t.weight;
      if (r <= 0) return t.type;
    }
    return 'heal';
  }

  function spawnPickup(type, x, y) {
    if (S.pickups.length >= CFG.pickup.cap) return null;
    var t = type || pickWeighted();
    var pk = poolTake('pickups', S.pickups);
    pk.type = t; pk.x = clamp(x, 26, W - 26); pk.y = clamp(y, 26, H - 26);
    pk.life = CFG.pickup.life; pk.max = CFG.pickup.life; pk.bob = rnd() * TAU;
    return pk;
  }

  function collectPickup(pk) {
    var p = S.player, info = CFG.pickupInfo[pk.type];
    var label = info.name;
    if (pk.type === 'heal') {
      if (p.hp < p.maxHp) { p.hp += 1; label = '+1 HP'; }
      else { S.score += 20; label = '+20 分'; }
    } else if (pk.type === 'shield') {
      p.shield = Math.max(p.shield, 3.5);
      label = '护盾 3.5s';
    } else if (pk.type === 'over') {
      p.over = Math.max(p.over, 8);
      label = '超载 8s';
    } else if (pk.type === 'slow') {
      S.slow = Math.max(S.slow, 4.5);
      label = '时缓 4.5s';
    } else if (pk.type === 'w_pulse' || pk.type === 'w_spread' || pk.type === 'w_laser') {
      var wid = pk.type === 'w_spread' ? 'spread' : (pk.type === 'w_laser' ? 'laser' : 'pulse');
      S.weaponPicks[wid] = (S.weaponPicks[wid] || 0) + 1;
      label = CFG.weapons[wid].name;
      var newEvo = checkWeaponEvolution();
      if (!S.evoForms.length) {
        p.weapon = wid;
      } else if (!newEvo) {
        // 已有进化形态：拾取同配方素材 → 续挂一份限时融合素材
        if (mountFusionMaterial(wid)) {
          label = '素材补充';
        } else {
          S.score += 40;
          label = '+40 分';
        }
      }
    } else if (pk.type === 'coin') {
      S.score += 40;
      label = '+40 分';
    }
    chargeFusionEnergy(pk.type);
    var cfl = poolTake('floats', S.floats);
    cfl.x = p.x; cfl.y = p.y - 44; cfl.text = label;
    cfl.life = 1.0; cfl.max = 1.0; cfl.vy = -46; cfl.size = 16; cfl.color = info.color;
    var crg = poolTake('rings', S.rings);
    crg.x = pk.x; crg.y = pk.y; crg.r = 6; crg.r1 = 60;
    crg.life = 0.4; crg.max = 0.4; crg.color = info.color;
    S.trauma = Math.min(1, S.trauma + 0.10);
    sfx.pickup();
  }

  // ===== 武器融合进化：PULSE/SCATTER → 星爆；LANCE(+穿透) → 裂空 =====
  function nextEvolutionFor() {
    var q = S.weaponPicks, pulse = q.pulse || 0, spread = q.spread || 0, laser = q.laser || 0;
    function has(id) { return S.evoForms.indexOf(id) >= 0; }
    // 星爆：脉冲主导（脉冲×2，或 PULSE × SCATTER）
    if (!has('nova') && (pulse >= 2 || (pulse >= 1 && spread >= 1))) return 'nova';
    // 棱镜：纯散射×2，边界折射
    if (!has('prism') && spread >= 2) return 'prism';
    // 裂空：穿透体系（LANCE×2，或 LANCE × 贯穿协议）
    if (!has('rift') && (laser >= 2 || (laser >= 1 && S.upgrades.pierce))) return 'rift';
    // 审判：散射 × 穿透，穿透弹幕
    if (!has('judgment') && laser >= 1 && spread >= 1) return 'judgment';
    // 相位：脉冲 × 穿透，自动追踪
    if (!has('pulsar') && laser >= 1 && pulse >= 1) return 'pulsar';
    return null;
  }

  function checkWeaponEvolution() {
    if (!runUnlocks(S.runNo || 1).fusion) return null;
    var id = nextEvolutionFor();
    if (!id) return null;
    evolveWeapon(id);
    return id;
  }

  function setEvoBanner(title, sub, dur) {
    S.evoBannerTitle = title;
    S.evoBannerSub = sub;
    S.evoBanner = dur || 2.4;
  }

  function matTier(count) {
    if (count >= 4) return 3;
    if (count === 3) return 2;
    return 1;
  }

  function fusionCap() {
    return CFG.fusion.capBase + (S.upgrades ? S.upgrades.core : 0) * CFG.fusion.coreCap;
  }

  function makeFusionMats(id) {
    var types = evoInfo(id).mats || ['pulse', 'pulse', 'spread', 'spread'];
    var out = [], cap = fusionCap();
    for (var i = 0; i < 4; i++) {
      var energy = Math.round(cap * (1 - i * 0.15));
      out.push({ type: types[i % types.length], life: energy, max: cap });
    }
    return out;
  }

  function chargeFusionEnergy(type) {
    var isWeapon = type.indexOf('w_') === 0;
    var wid = type === 'w_spread' ? 'spread' : (type === 'w_laser' ? 'laser' : (type === 'w_pulse' ? 'pulse' : ''));
    if (!S.evoForms.length || !S.evolved || !S.evoMats[S.evolved]) {
      S.energyBank = Math.min(100, S.energyBank + (isWeapon ? 18 : 10));
      return;
    }
    var arr = S.evoMats[S.evolved], cap = fusionCap();
    for (var i = 0; i < arr.length; i++) {
      arr[i].life = Math.min(cap, arr[i].life + (isWeapon ? 8 : 12));
      if (isWeapon && arr[i].type === wid) arr[i].life = Math.min(cap, arr[i].life + 35);
    }
  }

  function consumeFusionEnergy(amount) {
    if (!S.evoForms.length || !S.evolved) return;
    var arr = S.evoMats[S.evolved];
    if (!arr || !arr.length) return;
    var idx = 0;
    for (var i = 1; i < arr.length; i++) if (arr[i].life < arr[idx].life) idx = i;
    arr[idx].life = Math.max(0, arr[idx].life - amount);
  }

  function refundFusionEnergy(amount) {
    if (!S.evoForms.length || !S.evolved) {
      S.energyBank = Math.min(100, S.energyBank + amount);
      return;
    }
    var arr = S.evoMats[S.evolved];
    if (!arr || !arr.length) return;
    var idx = 0;
    for (var i = 1; i < arr.length; i++) if (arr[i].life < arr[idx].life) idx = i;
    arr[idx].life = Math.min(fusionCap(), arr[idx].life + amount);
  }

  function evolveWeapon(id) {
    if (!S.evoForms.length) S.lastBaseWeapon = S.player.weapon;
    if (S.evoForms.indexOf(id) < 0) S.evoForms.push(id);
    S.evoMats[id] = makeFusionMats(id);
    var bank = S.energyBank || 0;
    S.energyBank = 0;
    var cap = fusionCap();
    for (var bi = 0; bi < S.evoMats[id].length; bi++) {
      S.evoMats[id][bi].max = cap;
      S.evoMats[id][bi].life = Math.min(cap, S.evoMats[id][bi].life + Math.round(bank * 0.3));
    }
    S.evolved = id;
    S.player.weapon = id;
    S.evoTier = matTier(S.evoMats[id].length);
    // 进化不再切换 mode/暂停，也不打断按住开火：只做即时视觉反馈
    S.evolution = null;
    setEvoBanner('WEAPON EVOLUTION', evoInfo(id).sub, 1.8);
    S.fireCooldown = 0;
    S.victoryFlash = 0.3;
    S.trauma = Math.min(1, S.trauma + 0.3);
    sparkBurst(S.player.x, S.player.y, 30, id === 'nova' ? '#ffd45e' : '#c9a2ff');
    var rg = poolTake('rings', S.rings);
    rg.x = S.player.x; rg.y = S.player.y; rg.r = 12; rg.r1 = 150;
    rg.life = 0.6; rg.max = 0.6; rg.color = id === 'nova' ? '#ffd45e' : '#c9a2ff';
    sfx.evolve();
  }

  function mountFusionMaterial(type) {
    var ids = [S.evolved].concat(S.evoForms.filter(function (id) { return id !== S.evolved; }));
    for (var i = 0; i < ids.length; i++) {
      var id = ids[i], types = evoInfo(id).mats || [], arr = S.evoMats[id];
      if (!arr || types.indexOf(type) < 0) continue;
      var cap = fusionCap();
      if (arr.length < 4) {
        arr.push({ type: type, life: Math.round(cap * 0.45), max: cap });
      } else {
        var idx = -1, low = Infinity;
        for (var j = 0; j < arr.length; j++) {
          if (arr[j].type === type && arr[j].life < low) { low = arr[j].life; idx = j; }
        }
        if (idx < 0) {
          for (var k = 0; k < arr.length; k++) if (arr[k].life < low) { low = arr[k].life; idx = k; }
        }
        arr[idx].life = Math.min(cap, arr[idx].life + 60);
        arr[idx].max = cap;
      }
      if (id === S.evolved) S.evoTier = matTier(arr.length);
      setEvoBanner('FUSION MOUNT', type.toUpperCase() + ' 素材 · ' + arr.length + '/4', 1.2);
      S.victoryFlash = Math.max(S.victoryFlash, 0.12);
      return true;
    }
    return false;
  }

  function collapseFusion() {
    S.evolved = null;
    S.evoForms = [];
    S.evoMats = {};
    S.evoTier = 1;
    S.player.weapon = S.lastBaseWeapon || 'pulse';
    S.fireCooldown = 0;
    setEvoBanner('FUSION COLLAPSE', '素材能量耗尽 · 回到基础枪', 2.4);
    S.victoryFlash = Math.max(S.victoryFlash, 0.3);
    S.trauma = Math.min(1, S.trauma + 0.25);
    sfx.formSwitch();
  }

  function updateFusion(dt) {
    if (!S.evoForms.length) return;
    var activeBefore = S.evolved;
    var beforeCount = S.evoMats[activeBefore] ? S.evoMats[activeBefore].length : 0;
    var i, j;
    for (i = S.evoForms.length - 1; i >= 0; i--) {
      var id = S.evoForms[i], arr = S.evoMats[id];
      if (!arr) { S.evoForms.splice(i, 1); continue; }
      // Boss 战临时决策：能量消耗减半，避免高压躲弹时融合被硬性抽干
      var drain = S.wavePhase === 'boss' ? CFG.fusion.bossDrain : CFG.fusion.drain;
      for (j = arr.length - 1; j >= 0; j--) {
        arr[j].life -= drain * dt;
        if (arr[j].life <= 0) arr.splice(j, 1);
      }
      if (!arr.length) {
        delete S.evoMats[id];
        S.evoForms.splice(i, 1);
      }
    }
    if (!S.evoForms.length) { collapseFusion(); return; }
    if (S.evoForms.indexOf(S.evolved) < 0) {
      S.evolved = S.evoForms[0];
      S.player.weapon = S.evolved;
      S.evoTier = matTier(S.evoMats[S.evolved].length);
      setEvoBanner('FUSION DECAY', '素材能量耗尽 · 自动切换 ' + evoInfo(S.evolved).name, 1.8);
      S.victoryFlash = Math.max(S.victoryFlash, 0.2);
      return;
    }
    var count = S.evoMats[S.evolved].length;
    S.evoTier = matTier(count);
    if (count < beforeCount) {
      setEvoBanner('FUSION DECAY', count + '/4 · Lv.' + S.evoTier + ' · 素材能量耗尽', 1.6);
      S.victoryFlash = Math.max(S.victoryFlash, 0.16);
    }
  }

  function switchEvoForm() {
    if (S.mode !== 'playing' || S.evoForms.length < 2) return;
    var idx = S.evoForms.indexOf(S.evolved);
    S.evolved = S.evoForms[(idx + 1) % S.evoForms.length];
    S.player.weapon = S.evolved;
    S.evoTier = matTier(S.evoMats[S.evolved].length);
    S.fireCooldown = 0;
    setEvoBanner('FORM SWITCH', evoInfo(S.evolved).sub, 1.8);
    S.victoryFlash = Math.max(S.victoryFlash, 0.18);
    sfx.formSwitch();
  }

  function evoInfo(id) { return CFG.evo[id] || { name: id, sub: '', mats: [] }; }

  // 兼容旧测试/调用：进化现在是非阻塞的，不再有独立暂停阶段
  function updateEvolution() {
    S.evolution = null;
  }

  // ===== Boss 战利品：暂停三选一强化 =====
  function upgradePicks(id) { return S.upgrades.picks[id] || 0; }
  function upgradeDesc(d, n) { return typeof d.desc === 'function' ? d.desc(n) : d.desc; }

  function shuffleUpgrades(a) {
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(rnd() * (i + 1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }

  function rollUpgrades() {
    var pool = [], i, d;
    for (i = 0; i < UPGRADE_DEFS.length; i++) {
      d = UPGRADE_DEFS[i];
      if (upgradePicks(d.id) >= d.max) continue;
      if (d.unique && d.owned && d.owned()) continue;
      if (d.id === 'wing' && S.wingCount >= 3) continue;
      pool.push(d);
    }
    // 只在常规强化不足 3 张时才启用兜底，避免稀释正常构筑
    if (pool.length < 3) {
      for (i = 0; i < FALLBACK_UPGRADES.length; i++) {
        if (pool.indexOf(FALLBACK_UPGRADES[i]) < 0) pool.push(FALLBACK_UPGRADES[i]);
      }
    }
    if (!pool.length) return [];

    // 流派聚焦：某色系累计 ≥2 次后，三选一里至少 2 张来自该流派
    var dominant = null, best = 0, fam;
    for (fam in S.upgrades.family) {
      if (!S.upgrades.family.hasOwnProperty(fam)) continue;
      var c = S.upgrades.family[fam];
      if (c >= 2 && c > best) { best = c; dominant = fam; }
    }
    var chosen = [];
    if (dominant) {
      var famPool = [];
      for (i = 0; i < pool.length; i++) if (pool[i].family === dominant) famPool.push(pool[i]);
      shuffleUpgrades(famPool);
      for (i = 0; i < 2 && i < famPool.length; i++) chosen.push(famPool[i]);
    }
    var rest = [];
    for (i = 0; i < pool.length; i++) if (chosen.indexOf(pool[i]) < 0) rest.push(pool[i]);
    shuffleUpgrades(rest);
    while (chosen.length < 3 && rest.length) chosen.push(rest.shift());

    var out = [];
    for (i = 0; i < chosen.length; i++) {
      d = chosen[i];
      var n = upgradePicks(d.id);
      out.push({
        id: d.id, name: d.name, desc: upgradeDesc(d, n),
        family: d.family, familyName: FAMILY[d.family].name,
        color: FAMILY[d.family].color, tier: n + 1, max: d.max
      });
    }
    return out;
  }

  function findUpgrade(id) {
    for (var i = 0; i < ALL_UPGRADES.length; i++) if (ALL_UPGRADES[i].id === id) return ALL_UPGRADES[i];
    return null;
  }

  function setSysLog(text) {
    S.sysLog = { text: text, t: 0, dur: 1.6 };
  }

  function applyUpgrade(id) {
    var d = findUpgrade(id);
    if (!d) return null;
    var n = upgradePicks(id);
    if (n >= d.max) return null;
    if (d.unique && d.owned && d.owned()) return null;
    d.apply(n);
    S.upgrades.picks[id] = n + 1;
    S.upgrades.family[d.family] = (S.upgrades.family[d.family] || 0) + 1;
    if (id === 'damage') setSysLog('[警告：大范围杀伤性武器已解锁]');
    else if (id === 'rate') setSysLog('[系统超频：注意机体过热风险]');
    return d;
  }

  // 击杀 Boss 后先进入约 0.3s 的子弹时间，再缓缓拉出三选一
  function startReward(dropCount) {
    S.mode = 'reward';
    S.rewardT = 0;
    S.rewardDrops = dropCount || 0;
    input.firing = false;
  }

  function updateReward(dt) {
    S.rewardT += dt;
    if (S.victoryFlash > 0) S.victoryFlash = Math.max(0, S.victoryFlash - dt);
    updateShake(dt, 0.6);
    stepParticles(dt * 0.45);     // 慢动作：粒子只走 45% 时间
    if (S.rewardT >= S.rewardDur) {
      openUpgrade(S.rewardDrops);
    }
  }

  function openUpgrade(lootCount) {
    S.mode = 'upgrade';
    input.firing = false;
    S.upgrade = { t: 0, options: rollUpgrades(), hover: -1, dropCount: lootCount || 0 };
    duckMusic(true);
    sfx.upgradeOpen();
  }

  function chooseUpgrade(i) {
    var u = S.upgrade;
    if (!u) return;
    var opt = u.options[i];
    if (!opt) return;
    applyUpgrade(opt.id);
    S.upgrade = null;
    S.mode = 'playing';
    S.fireCooldown = 0;
    input.firing = false;
    // 立即刷新连击窗口并在玩家周围生成一圈敌人，避免 Boss 后空窗断 Combo
    S.comboTimer = comboWindow();
    S.spawnTimer = 0.45;
    spawnSurge(8);
    S.waveBanner = 2.2;
    S.waveBannerText = 'WAVE ' + S.wave + ' · 强化完成' +
      (S.waveAffixes.length ? ' · ' + affixText() : '') +
      (S.metaJustUnlocked ? ' · 系统升级已解锁' : '');
    S.metaJustUnlocked = false;
    duckMusic(false);
    sfx.upgradePick();
    // 若刚拿到“贯穿协议”且已持有 LANCE，立即满足裂空融合
    if (!S.evolved) checkWeaponEvolution();
  }

  function spawnSurge(n) {
    var p = S.player;
    if (!p) return;
    for (var i = 0; i < n; i++) {
      if (S.enemies.length >= CFG.enemy.cap) break;
      spawnEnemy();
      var e = S.enemies[S.enemies.length - 1];
      var a = (i / n) * TAU + rnd() * 0.35;
      var r = 240 + rnd() * 80;
      e.x = clamp(p.x + Math.cos(a) * r, 30, W - 30);
      e.y = clamp(p.y + Math.sin(a) * r, 60, H - 30);
      e.phase = rnd() * TAU;
    }
  }

  // 僚机：环绕玩家、自动索敌；数量靠强化，等级靠击杀 Boss
  function updateWings(dt) {
    var p = S.player;
    if (!p) return;
    for (var i = 0; i < S.wings.length; i++) {
      var wg = S.wings[i];
      wg.angle += dt * 1.6;
      var baseA = wg.angle + i * (TAU / Math.max(1, S.wings.length));
      wg.x = p.x + Math.cos(baseA) * 58;
      wg.y = p.y + Math.sin(baseA) * 58;
      if (wg.flash > 0) wg.flash = Math.max(0, wg.flash - dt);
      wg.cd -= dt;
      if (wg.cd > 0) continue;
      var target = null, best = 460 * 460;
      if (S.boss && S.boss.state === 'active') {
        var bdx = S.boss.x - wg.x, bdy = S.boss.y - wg.y, bd = bdx * bdx + bdy * bdy;
        if (bd < best) { best = bd; target = S.boss; }
      }
      for (var j = 0; j < S.enemies.length; j++) {
        var e = S.enemies[j];
        if (e.hp <= 0) continue;
        var dx = e.x - wg.x, dy = e.y - wg.y, d2 = dx * dx + dy * dy;
        if (d2 < best) { best = d2; target = e; }
      }
      if (!target) { wg.cd = 0.12; continue; }
      var ang = Math.atan2(target.y - wg.y, target.x - wg.x);
      var b = poolTake('bullets', S.bullets);
      b.x = wg.x; b.y = wg.y;
      b.vx = Math.cos(ang) * 720; b.vy = Math.sin(ang) * 720;
      b.life = 2.4; b.dmg = 1.2 + 0.9 * S.wingLevel; b.r = 2.5;
      b.pierce = !!(S.upgrades && S.upgrades.pierce);
      b.bossHit = false;
      if (b.hits) b.hits.length = 0; else b.hits = [];
      b.color = '#7fe8ff'; b.wing = true;
      wg.cd = Math.max(0.42, 0.95 - (S.wingLevel - 1) * 0.07);
      wg.flash = 0.12;
    }
  }

  function upgradeCardRect(i) {
    var cw = 250, ch = 300, gap = 28;
    var total = cw * 3 + gap * 2;
    var x0 = (W - total) / 2;
    return { x: x0 + i * (cw + gap), y: 176, w: cw, h: ch };
  }

  function upgradeHit(mx, my) {
    if (!S.upgrade) return -1;
    for (var i = 0; i < S.upgrade.options.length; i++) {
      var r = upgradeCardRect(i);
      if (mx >= r.x && mx <= r.x + r.w && my >= r.y && my <= r.y + r.h) return i;
    }
    return -1;
  }

  function stepParticles(dt) {
    var i;
    for (i = S.sparks.length - 1; i >= 0; i--) {
      var sp = S.sparks[i];
      sp.x += sp.vx * dt; sp.y += sp.vy * dt;
      sp.vx *= (1 - 5 * dt); sp.vy *= (1 - 5 * dt);
      sp.life -= dt;
      if (sp.life <= 0) poolGive('sparks', S.sparks, i);
    }
    for (i = S.chunks.length - 1; i >= 0; i--) {
      var ch = S.chunks[i];
      ch.x += ch.vx * dt; ch.y += ch.vy * dt;
      ch.vx *= (1 - 4 * dt); ch.vy *= (1 - 4 * dt);
      ch.rot += ch.vr * dt;
      ch.life -= dt;
      if (ch.life <= 0) poolGive('chunks', S.chunks, i);
    }
    for (i = S.rings.length - 1; i >= 0; i--) {
      S.rings[i].life -= dt;
      if (S.rings[i].life <= 0) poolGive('rings', S.rings, i);
    }
    for (i = S.floats.length - 1; i >= 0; i--) {
      S.floats[i].y += S.floats[i].vy * dt;
      S.floats[i].life -= dt;
      if (S.floats[i].life <= 0) poolGive('floats', S.floats, i);
    }
    for (i = S.chainFx.length - 1; i >= 0; i--) {
      S.chainFx[i].life -= dt;
      if (S.chainFx[i].life <= 0) S.chainFx.splice(i, 1);
    }
  }

  // 暂停期间只推进爆炸/震屏/闪光，不推进游戏世界
  function updateUpgrade(dt) {
    if (S.upgrade) S.upgrade.t += dt;
    if (S.victoryFlash > 0) S.victoryFlash = Math.max(0, S.victoryFlash - dt);
    updateShake(dt);
    stepParticles(dt);
  }

  function drawUpgradeGlyph(id, x, y, color) {
    ctx.save();
    ctx.translate(x, y);
    ctx.strokeStyle = color;
    ctx.fillStyle = color;
    ctx.lineWidth = 2.5;
    ctx.shadowColor = color;
    ctx.shadowBlur = 12;
    if (id === 'double') {
      ctx.fillRect(-12, -14, 7, 28);
      ctx.fillRect(5, -14, 7, 28);
    } else if (id === 'rate') {
      for (var i = 0; i < 3; i++) {
        ctx.beginPath();
        ctx.moveTo(-14 + i * 10, -12);
        ctx.lineTo(-4 + i * 10, 0);
        ctx.lineTo(-14 + i * 10, 12);
        ctx.stroke();
      }
    } else if (id === 'damage') {
      ctx.beginPath(); ctx.moveTo(0, -16); ctx.lineTo(14, 12); ctx.lineTo(-14, 12); ctx.closePath(); ctx.fill();
    } else if (id === 'pierce') {
      ctx.beginPath(); ctx.arc(0, 0, 10, 0, TAU); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(-18, 0); ctx.lineTo(18, 0); ctx.stroke();
    } else if (id === 'speed') {
      ctx.beginPath(); ctx.moveTo(-14, -10); ctx.lineTo(14, 0); ctx.lineTo(-14, 10); ctx.closePath(); ctx.fill();
    } else if (id === 'hp') {
      ctx.fillRect(-4, -16, 8, 32);
      ctx.fillRect(-16, -4, 32, 8);
    } else if (id === 'magnet') {
      ctx.beginPath(); ctx.arc(0, 0, 13, 0, TAU); ctx.stroke();
      ctx.beginPath(); ctx.arc(0, 0, 6, 0, TAU); ctx.stroke();
    } else if (id === 'combo') {
      ctx.beginPath(); ctx.arc(-8, 0, 7, 0, TAU); ctx.stroke();
      ctx.beginPath(); ctx.arc(8, 0, 7, 0, TAU); ctx.stroke();
    } else if (id === 'wing') {
      ctx.beginPath(); ctx.moveTo(-12, -8); ctx.lineTo(-4, 0); ctx.lineTo(-12, 8); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(2, -10); ctx.lineTo(10, 0); ctx.lineTo(2, 10); ctx.stroke();
    } else {
      ctx.beginPath(); ctx.arc(0, 0, 12, 0, TAU); ctx.stroke();
    }
    ctx.restore();
  }

  function drawUpgrade() {
    var u = S.upgrade;
    if (!u) return;
    var a = clamp(u.t / 0.4, 0, 1);
    ctx.save();
    ctx.globalAlpha = 0.84 * a;
    ctx.fillStyle = '#03040a';
    ctx.fillRect(0, 0, W, H);
    ctx.restore();

    ctx.save();
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.globalAlpha = a * 0.95;
    ctx.shadowColor = '#5ee8ff';
    ctx.shadowBlur = 22;
    ctx.fillStyle = '#eaf6ff';
    ctx.font = '800 32px ' + FONT;
    ctx.fillText('SYSTEM UPGRADE', W / 2, 104);
    ctx.shadowBlur = 0;
    ctx.globalAlpha = a * 0.55;
    ctx.fillStyle = '#9fb8d8';
    ctx.font = '500 13px ' + FONT;
    ctx.fillText('选择一项强化 · WAVE ' + S.wave + ' · 游戏已暂停', W / 2, 136);
    if (u.dropCount > 0) {
      // 主观、模糊的感知措辞；随叙事阶段变化，避免"系统投放"口吻
      var signalText = story.phase >= 2
        ? '残骸中仍有 ' + u.dropCount + ' 个信号'
        : story.phase === 1
          ? '探测到 ' + u.dropCount + ' 个未登记信号'
          : '探测到 ' + u.dropCount + ' 个可回收信号';
      ctx.globalAlpha = a * 0.72;
      ctx.fillStyle = '#ffd45e';
      ctx.font = '500 12px ' + FONT;
      ctx.fillText(signalText, W / 2, 158);
    }
    ctx.restore();

    for (var i = 0; i < u.options.length; i++) {
      var opt = u.options[i], r = upgradeCardRect(i);
      var hover = u.hover === i;
      var ca = clamp((u.t - i * 0.08) / 0.3, 0, 1);
      ctx.save();
      ctx.globalAlpha = ca;
      ctx.translate(0, (1 - ca) * 24);
      ctx.fillStyle = hover ? 'rgba(24, 40, 70, 0.95)' : 'rgba(12, 18, 34, 0.92)';
      ctx.strokeStyle = opt.color;
      ctx.lineWidth = hover ? 2.5 : 1.5;
      ctx.shadowColor = opt.color;
      ctx.shadowBlur = hover ? 22 : 8;
      ctx.beginPath();
      ctx.rect(r.x, r.y, r.w, r.h);
      ctx.fill();
      ctx.stroke();
      ctx.shadowBlur = 0;

      ctx.fillStyle = 'rgba(150, 190, 255, 0.55)';
      ctx.font = '600 12px ' + FONT;
      ctx.textAlign = 'left';
      ctx.fillText('[' + (i + 1) + ']', r.x + 16, r.y + 20);
      ctx.textAlign = 'right';
      ctx.fillStyle = opt.color;
      ctx.globalAlpha = ca * 0.85;
      ctx.font = '600 11px ' + FONT;
      ctx.fillText(opt.familyName, r.x + r.w - 16, r.y + 20);

      drawUpgradeGlyph(opt.id, r.x + r.w / 2, r.y + 84, opt.color);

      ctx.textAlign = 'center';
      ctx.fillStyle = 'rgba(200, 220, 255, 0.55)';
      ctx.font = '500 11px ' + FONT;
      ctx.fillText('品质 ' + QUALITY[Math.min(QUALITY.length - 1, opt.tier - 1)], r.x + r.w / 2, r.y + 126);
      ctx.fillStyle = opt.color;
      ctx.font = '800 21px ' + FONT;
      ctx.fillText(opt.name, r.x + r.w / 2, r.y + 156);
      ctx.fillStyle = '#cfe0f5';
      ctx.font = '400 13px ' + FONT;
      ctx.fillText(opt.desc, r.x + r.w / 2, r.y + 190);
      ctx.fillStyle = 'rgba(150, 180, 230, 0.45)';
      ctx.font = '500 11px ' + FONT;
      ctx.fillText(hover ? '点击选择' : '强化模块', r.x + r.w / 2, r.y + r.h - 26);
      ctx.restore();
    }

    var build = [];
    if (S.upgrades.shots > 0) build.push('双发×' + S.upgrades.shots);
    if (S.upgrades.rate < 1) build.push('射速×' + (1 / S.upgrades.rate).toFixed(2));
    if (S.upgrades.dmg > 1) build.push('伤害×' + S.upgrades.dmg.toFixed(2));
    if (S.upgrades.pierce) build.push('穿透');
    if (S.upgrades.speed > 1) build.push('移速×' + S.upgrades.speed.toFixed(2));
    if (S.upgrades.hpBonus > 0) build.push('HP+' + S.upgrades.hpBonus);
    if (S.upgrades.magnet > 1) build.push('磁吸×' + S.upgrades.magnet.toFixed(1));
    if (S.upgrades.combo > 1) build.push('连击×' + S.upgrades.combo.toFixed(1));
    if (S.upgrades.bulletSpeed > 1) build.push('弹速×' + S.upgrades.bulletSpeed.toFixed(2));
    ctx.save();
    ctx.textAlign = 'center';
    ctx.globalAlpha = a * 0.5;
    ctx.fillStyle = '#9fb8d8';
    ctx.font = '500 12px ' + FONT;
    ctx.fillText('已装配：' + (build.length ? build.join(' · ') : '无'), W / 2, 524);
    var famText = [];
    for (var f in S.upgrades.family) {
      if (!S.upgrades.family.hasOwnProperty(f)) continue;
      if (S.upgrades.family[f] > 0) famText.push(FAMILY[f].name + ' ' + S.upgrades.family[f]);
    }
    ctx.globalAlpha = a * 0.42;
    ctx.fillStyle = '#8fa8c8';
    ctx.font = '500 11px ' + FONT;
    ctx.fillText('流派：' + (famText.length ? famText.join(' · ') : '未定'), W / 2, 544);
    ctx.restore();
  }

  // ===== 波次 + Boss：60s 一波，50s 警告，60s 小怪聚合出 Boss =====
  function updateWave(dt) {
    if (S.wavePhase === 'boss') { updateBoss(dt); return; }
    S.waveT += dt;
    if (S.wavePhase === 'normal' && S.waveT >= CFG.wave.warnAt) {
      S.wavePhase = 'warning';
      S.warnTick = 0;
      sfx.warn();
    }
    if (S.wavePhase === 'warning') {
      S.warnTick -= dt;
      if (S.warnTick <= 0) { S.warnTick = 2; sfx.warn(); }
    }
    if (S.waveT >= CFG.wave.interval) spawnBoss();
  }

  function spawnBoss() {
    S.wavePhase = 'boss';
    S.waveAffixes = [];
    S.affixCursor = 0;
    S.fields.length = 0;
    S.affixBlasts.length = 0; S.affixGhosts.length = 0; S.affixLinks.length = 0;
    var floorHp = CFG.wave.bossBaseHp + CFG.wave.bossHpPerWave * (S.wave - 1);
    var hp = Math.max(floorHp, Math.round(playerDpsEstimate() * CFG.wave.bossTtk));
    if (S.runNo === 1) hp = Math.max(1, Math.round(hp * 0.5));
    S.boss = {
      x: W / 2, y: H / 2, r: CFG.wave.bossRadius,
      hp: hp, maxHp: hp, t: 0, formT: 0, state: 'forming', rise: 0,
      flash: 0, attackT: 0, ringAngle: 0, phase55: false, phase25: false
    };
    S.trauma = Math.min(1, S.trauma + 0.6);
    sfx.bossSpawn();
    startBossMusic();
    updateBossMusic();
  }

  function updateBoss(dt) {
    var b = S.boss;
    if (!b) return;
    b.t += dt;
    updateBossMusic();
    if (b.state === 'forming') {
      b.formT += dt;
      b.y = H / 2;
      // 小怪只做动画层面的聚合：被吸向屏幕中央的 Boss，不参与碰撞
      var es = S.enemies, ease = Math.min(1, dt * 8), i;
      for (i = 0; i < es.length; i++) {
        es[i].x += (b.x - es[i].x) * ease;
        es[i].y += (b.y - es[i].y) * ease;
      }
      if (b.formT >= CFG.wave.bossForm) {
        for (i = 0; i < es.length; i++) poolRecycle('enemies', es[i]);
        es.length = 0;
        b.state = 'active';
        b.rise = 0;
        sparkBurst(b.x, b.y, 30, '#ff3f8e');
        S.trauma = Math.min(1, S.trauma + 0.3);
      }
      return;
    }
    if (b.flash > 0) b.flash = Math.max(0, b.flash - dt);
    b.rise = Math.min(1, (b.rise || 0) + dt * 1.8);
    b.x = W / 2 + Math.sin(b.t * 0.55) * 200 * b.rise;
    b.y = H / 2 + (CFG.wave.bossY - H / 2) * b.rise + Math.sin(b.t * 0.9) * 14 * b.rise;
    b.attackT += dt;
    // 升空到位后才开火，避免弹幕在屏幕中央贴脸生成
    if (b.rise > 0.85 && b.attackT >= CFG.wave.ringEvery) {
      b.attackT = 0;
      fireBossRing();
      sfx.bossFire();
    }
    var p = S.player;
    var dx = p.x - b.x, dy = p.y - b.y, rr = b.r * 0.82 + p.r;
    // 成形后先升空，升到一定程度才允许碰撞，避免在屏幕中央"贴脸生成"
    if (b.rise > 0.35 && dx * dx + dy * dy <= rr * rr && p.inv <= 0 && p.shield <= 0) hurtPlayer(b);
  }

  function fireBossRing() {
    var b = S.boss;
    if (!b) return;
    var n = Math.min(32, CFG.wave.ringBase + (S.wave - 1) * 2);
    for (var i = 0; i < n; i++) {
      var a = b.ringAngle + i * TAU / n;
      var eb = poolTake('ebullets', S.ebullets);
      eb.x = b.x; eb.y = b.y;
      eb.vx = Math.cos(a) * CFG.wave.ringSpeed;
      eb.vy = Math.sin(a) * CFG.wave.ringSpeed;
      eb.life = CFG.wave.ringLife;
      eb.r = CFG.wave.bulletR;
      eb.color = '#ff6fae';
    }
    b.ringAngle += 0.22;
  }

  function damageBoss(dmg, hx, hy) {
    var b = S.boss;
    if (!b || b.state !== 'active') return;
    b.hp -= dmg;
    b.flash = 0.09;
    if (S.bossRefundArmed) {
      S.bossRefundArmed = false;
      refundFusionEnergy(CFG.fusion.bossHitRefund);
    }
    sparkBurst(hx, hy, 4, '#ffd45e');
    S.trauma = Math.min(1, S.trauma + 0.02);
    var ratio = b.maxHp > 0 ? b.hp / b.maxHp : 0;
    if (ratio <= 0.55 && !b.phase55) {
      b.phase55 = true;
      sfx.bossPhase();
      S.trauma = Math.min(1, S.trauma + 0.25);
    }
    if (ratio <= 0.25 && !b.phase25) {
      b.phase25 = true;
      sfx.bossPhase();
      S.trauma = Math.min(1, S.trauma + 0.35);
    }
    if (S.time - (bossMusic.lastHitSfx || -1) > 0.08) {
      bossMusic.lastHitSfx = S.time;
      sfx.bossHit();
    }
    updateBossMusic();
    if (b.hp <= 0) killBoss();
  }

  function killBoss() {
    var b = S.boss;
    if (!b) return;
    S.score += 400 * S.wave;
    S.kills += 1;
    if (S.combo > S.maxCombo) S.maxCombo = S.combo;
    // Boss 残骸：每击杀 1 只 Boss 获得 1 枚数据碎片，立即持久化
    meta.shards += 1;
    S.shardsEarned = (S.shardsEarned || 0) + 1;
    saveMeta();
    var flShard = poolTake('floats', S.floats);
    flShard.x = b.x; flShard.y = b.y - 70;
    flShard.text = '+1 碎片'; flShard.life = 1.0; flShard.max = 1.0;
    flShard.vy = -32; flShard.size = 15; flShard.color = '#ffd45e';
    // 每次击杀 Boss，全体僚机升级（数量靠强化，等级靠 Boss）
    if (S.wingCount > 0 && S.wingLevel < 6) {
      S.wingLevel += 1;
      var flWing = poolTake('floats', S.floats);
      flWing.x = S.player.x; flWing.y = S.player.y - 64;
      flWing.text = 'WING Lv.' + S.wingLevel; flWing.life = 1.0; flWing.max = 1.0;
      flWing.vy = -30; flWing.size = 16; flWing.color = '#7fe8ff';
      sfx.wingLevel();
    }
    // 极其夸张的爆炸：多层火花 + 碎片 + 三重扩散环 + 全屏闪光
    sparkBurst(b.x, b.y, 120, '#ffd45e');
    sparkBurst(b.x, b.y, 40, '#ff6fae');
    chunkBurst(b.x, b.y, 40);
    for (var ri = 0; ri < 3; ri++) {
      var rg = poolTake('rings', S.rings);
      rg.x = b.x; rg.y = b.y;
      rg.r = 20 + ri * 12; rg.r1 = 200 + ri * 80;
      rg.life = 0.6 + ri * 0.15; rg.max = rg.life;
      rg.color = ri === 1 ? '#ffd45e' : '#ff6fae';
    }
    S.trauma = 1;
    S.hitStop = 0.14;
    S.victoryFlash = 0.35;
    // Boss 也掉落普通道具：保底修复 + 2 件随机，避免选完强化后血量/增益断档
    spawnPickup('heal', b.x - 74, b.y + 24);
    spawnPickup(null, b.x + 74, b.y + 24);
    spawnPickup(null, b.x, b.y + 96);
    poolReleaseAll('ebullets', S.ebullets);
    S.boss = null;
    S.wave += 1;
    S.waveT = 0;
    S.wavePhase = 'normal';
    rollWaveAffixes();
    if (S.runNo >= 3 && !progress.metaUnlocked) {
      progress.metaUnlocked = true;
      saveProgress();
      S.metaJustUnlocked = true;
      setSysLog('学员07，模拟核心已击穿。系统升级权限开放。');
    }
    S.spawnTimer = 0.4;
    S.waveBanner = 0;
    S.waveBannerText = '';
    stopBossMusic();
    sfx.bossDie();
    sfx.bossVictory();
    startReward(3);
  }

  // 震动：trauma² 驱动 + 硬上限 + 低频平滑摆动（不再每帧随机换向）
  function updateShake(dt, mul) {
    mul = mul || 1;
    S.trauma = Math.max(0, S.trauma - CFG.shake.decay * dt * mul);
    S.shakeTime += dt;
    var t2 = S.trauma * S.trauma;
    var amp = Math.min(CFG.shake.maxOffset, t2 * CFG.shake.maxOffset);
    var rot = Math.min(CFG.shake.maxRot, t2 * CFG.shake.maxRot);
    var sx = (Math.sin(S.shakeTime * 26.0) * 0.6 + Math.sin(S.shakeTime * 17.0 + 1.3) * 0.4) * amp;
    var sy = (Math.cos(S.shakeTime * 22.0 + 0.6) * 0.6 + Math.sin(S.shakeTime * 31.0 + 2.1) * 0.4) * amp * 0.75;
    var sr = Math.sin(S.shakeTime * 13.0 + 1.9) * rot;
    S.shakeX = clamp(sx, -CFG.shake.maxOffset, CFG.shake.maxOffset);
    S.shakeY = clamp(sy, -CFG.shake.maxOffset, CFG.shake.maxOffset);
    S.shakeRot = clamp(sr, -CFG.shake.maxRot, CFG.shake.maxRot);
  }

  // ===== 模拟（固定顺序：玩家 → 子弹 → 敌人 → 接触 → 生成 → 连击 → 震动 → 粒子）=====
  function update(dt) {
    if (S.hitStop > 0) { S.hitStop -= dt; if (S.hitStop < 0) S.hitStop = 0; return; }

    S.time += dt; S.elapsed += dt;
    updateWave(dt);
    updateAffixFields(dt);
    updateAffixEffects(dt);
    var p = S.player, i, j;

    if (p.inv > 0) p.inv = Math.max(0, p.inv - dt);
    if (p.shield > 0) p.shield = Math.max(0, p.shield - dt);
    if (p.over > 0) p.over = Math.max(0, p.over - dt);
    if (S.slow > 0) S.slow = Math.max(0, S.slow - dt);
    p.aim = Math.atan2(input.my - p.y, input.mx - p.x);

    var dx = (input.right ? 1 : 0) - (input.left ? 1 : 0);
    var dy = (input.down ? 1 : 0) - (input.up ? 1 : 0);
    var dl = Math.hypot(dx, dy);
    if (dl > 0) { dx /= dl; dy /= dl; }
    var spd = ship().speed * (S.upgrades ? S.upgrades.speed : 1) *
      (1 + 0.05 * (progress.metaUnlocked && meta ? meta.speed : 0));
    for (i = 0; i < S.fields.length; i++) {
      var ff = S.fields[i], fdx = p.x - ff.x, fdy = p.y - ff.y;
      if (fdx * fdx + fdy * fdy < (ff.r + p.r) * (ff.r + p.r)) { spd *= CFG.affix.fieldSlow; break; }
    }
    p.x = clamp(p.x + dx * spd * dt, p.r, W - p.r);
    p.y = clamp(p.y + dy * spd * dt, p.r, H - p.r);

    S.fireCooldown -= dt;
    if (input.firing && S.fireCooldown <= 0) shoot();
    updateWings(dt);
    updateFusion(dt);
    if (S.muzzle > 0) S.muzzle = Math.max(0, S.muzzle - dt);

    // 空间哈希：本帧子弹碰撞使用敌人当前坐标（网格覆盖屏幕外生成点）。
    // 热路径内联 3×3 链表遍历、不分配候选数组：碰撞半径 ≤ 64px，必然落在 3×3 内。
    var es = S.enemies;
    var gridOn = es.length > 0;
    if (gridOn) gridBuild();
    var gHead = gridHead, gNext = gridNext, gW = GRID_W;

    // 子弹：只查自身所在格的 3×3 邻域
    for (i = S.bullets.length - 1; i >= 0; i--) {
      var b = S.bullets[i];
      if (b.homing) steerBullet(b, dt);
      b.x += b.vx * dt; b.y += b.vy * dt; b.life -= dt;
      // 棱镜：一次边界折射
      if (b.bounce > 0) {
        var bounced = false;
        if (b.x < 6) { b.x = 6; b.vx = Math.abs(b.vx); bounced = true; }
        else if (b.x > W - 6) { b.x = W - 6; b.vx = -Math.abs(b.vx); bounced = true; }
        if (b.y < 6) { b.y = 6; b.vy = Math.abs(b.vy); bounced = true; }
        else if (b.y > H - 6) { b.y = H - 6; b.vy = -Math.abs(b.vy); bounced = true; }
        if (bounced) {
          b.bounce -= 1;
          sparkBurst(b.x, b.y, 4, '#6dffb0');
          sfx.split();
        }
      }
      if (b.life <= 0 || b.x < -40 || b.x > W + 40 || b.y < -40 || b.y > H + 40) {
        poolGive('bullets', S.bullets, i); continue;
      }
      // Boss 碰撞（Boss 不在小怪网格里；穿透弹只结算一次）
      if (S.boss && S.boss.state === 'active' && !b.bossHit) {
        var bossRd = S.boss.r * 0.85 + b.r;
        var bossDx = S.boss.x - b.x, bossDy = S.boss.y - b.y;
        if (bossDx * bossDx + bossDy * bossDy <= bossRd * bossRd) {
          damageBoss(b.dmg, b.x, b.y);
          b.bossHit = true;
          if (!b.pierce) { poolGive('bullets', S.bullets, i); continue; }
        }
      }
      if (S.wavePhase === 'boss') continue;   // Boss 战期间不结算小怪
      if (!gridOn) continue;
      var bx = b.x, by = b.y, hitE = null;
      var bcx = gridCellX(bx), bcy = gridCellY(by);
      var bx1 = bcx > 0 ? bcx - 1 : 0, bx2 = bcx < GRID_W - 1 ? bcx + 1 : GRID_W - 1;
      var by1 = bcy > 0 ? bcy - 1 : 0, by2 = bcy < GRID_H - 1 ? bcy + 1 : GRID_H - 1;
      for (var gy = by1; gy <= by2; gy++) {
        var grow = gy * gW;
        for (var gx = bx1; gx <= bx2; gx++) {
          var idx = gHead[grow + gx];
          while (idx !== -1) {
            var e = es[idx];
            idx = gNext[idx];
            if (e.hp <= 0) continue;             // 本帧已击杀（移除延迟到遍历结束，保网格下标有效）
            var er = e.r + b.r, eBx = e.x - bx, eBy = e.y - by;
            if (eBx * eBx + eBy * eBy > er * er) continue;
            if (b.pierce && b.hits && b.hits.indexOf(enemyUid(e)) >= 0) continue;
            hitE = e;
            break;
          }
          if (hitE !== null) break;
        }
        if (hitE !== null) break;
      }
      if (hitE === null) continue;
      hitE.hp -= b.dmg;
      hitE.flash = 0.09;
      sparkBurst(bx, by, CFG.fx.hitSparks, COL.spark);
      if (S.evolved === 'nova' && !b.child && !b.splitDone) {
        b.splitDone = true;
        spawnSplit(b);
      }
      if (S.evolved === 'rift' && !b.exploded) {
        b.exploded = true;
        riftExplode(b.x, b.y, b.dmg * (0.45 + 0.1 * S.evoTier), hitE);
      }
      if (b.pierce) { b.hits.push(enemyUid(hitE)); } else { poolGive('bullets', S.bullets, i); }
      if (hitE.hp <= 0) killEnemy(hitE);
      if (S.upgrades && S.upgrades.chain > 0) tryChain(hitE);
    }

    // 统一回收本帧被击杀的敌人：紧凑化活跃数组（保持相对顺序，O(E)）
    var ew = 0;
    for (i = 0; i < es.length; i++) {
      var ed = es[i];
      if (ed.hp > 0) es[ew++] = ed;
      else poolRecycle('enemies', ed);
    }
    es.length = ew;

    if (S.wavePhase !== 'boss') {
    // 敌人追击（时缓期间整体降速）
    var spdF = S.slow > 0 ? 0.45 : 1;
    for (i = S.enemies.length - 1; i >= 0; i--) {
      var en = S.enemies[i];
      if (en.buffT > 0) en.buffT = Math.max(0, en.buffT - dt);
      if (en.affix === 'phase') {
        en.blinkT -= dt;
        if (en.blinkT <= 0) {
          en.blinkT = 2.4 + rnd() * 0.8;
          var oldX = en.x, oldY = en.y;
          var ba = Math.atan2(p.y - en.y, p.x - en.x) + (rnd() - 0.5) * 1.6;
          var bd = 55 + rnd() * 45;
          en.x = clamp(en.x + Math.cos(ba) * bd, 20, W - 20);
          en.y = clamp(en.y + Math.sin(ba) * bd, 20, H - 20);
          if (S.affixGhosts.length >= 24) S.affixGhosts.shift();
          S.affixGhosts.push({ x: oldX, y: oldY, r: en.r, life: 0.4, max: 0.4, color: CFG.affixes.phase.color });
          sparkBurst(en.x, en.y, 6, CFG.affixes.phase.color);
          sfx.phase();
        }
      }
      var ex = p.x - en.x, ey = p.y - en.y;
      var edist = Math.hypot(ex, ey) || 1;
      if (en.affix === 'tractor' && edist < 260) {
        p.x = clamp(p.x + (en.x - p.x) / edist * 60 * dt, p.r, W - p.r);
        p.y = clamp(p.y + (en.y - p.y) / edist * 60 * dt, p.r, H - p.r);
      }
      var enSpd = en.spd * (en.buffT > 0 ? en.buffSpd : 1);
      var wob = Math.sin(S.time * 3 + en.phase) * 34 * spdF;
      en.x += (ex / edist * enSpd * spdF + (-ey / edist) * wob) * dt;
      en.y += (ey / edist * enSpd * spdF + (ex / edist) * wob) * dt;
      if (en.flash > 0) en.flash = Math.max(0, en.flash - dt);
      // 接触
      var cd = Math.hypot(p.x - en.x, p.y - en.y);
      if (cd < en.r + p.r) {
        if (p.inv <= 0 && p.shield <= 0) {
          hurtPlayer(en);
          poolGive('enemies', S.enemies, i);
          continue;
        }
        if (p.shield > 0) {
          sparkBurst(en.x, en.y, 6, '#5ee8ff');
          var srg = poolTake('rings', S.rings);
          srg.x = en.x; srg.y = en.y; srg.r = 6; srg.r1 = 42;
          srg.life = 0.3; srg.max = 0.3; srg.color = '#5ee8ff';
          poolGive('enemies', S.enemies, i);
          continue;
        }
        var kx = en.x - p.x, ky = en.y - p.y, kd = Math.hypot(kx, ky) || 1;
        en.x = p.x + kx / kd * (en.r + p.r + 1);
        en.y = p.y + ky / kd * (en.r + p.r + 1);
      }
    }

    // 敌人之间轻推：同一张网格查邻居（只处理 i < j 的配对），替代 O(E²) 全遍历。
    // 同样内联链表遍历，不分配候选数组。
    if (es.length > 1) {
      gridBuild();
      gHead = gridHead; gNext = gridNext; gW = GRID_W;
      for (i = 0; i < es.length; i++) {
        var a1 = es[i];
        var acx = gridCellX(a1.x), acy = gridCellY(a1.y);
        var ax1 = acx > 0 ? acx - 1 : 0, ax2 = acx < GRID_W - 1 ? acx + 1 : GRID_W - 1;
        var ay1 = acy > 0 ? acy - 1 : 0, ay2 = acy < GRID_H - 1 ? acy + 1 : GRID_H - 1;
        for (var sgy = ay1; sgy <= ay2; sgy++) {
          var srow = sgy * gW;
          for (var sgx = ax1; sgx <= ax2; sgx++) {
            var sidx = gHead[srow + sgx];
            while (sidx !== -1) {
              var b1 = es[sidx];
              sidx = gNext[sidx];
              if (b1.__idx <= i) continue;
              var ddx = b1.x - a1.x, ddy = b1.y - a1.y;
              var minD = a1.r + b1.r;
              var d2 = ddx * ddx + ddy * ddy;
              if (d2 > 0.0001 && d2 < minD * minD) {
                var dd = Math.sqrt(d2), push = (minD - dd) * 0.5;
                ddx /= dd; ddy /= dd;
                a1.x -= ddx * push; a1.y -= ddy * push;
                b1.x += ddx * push; b1.y += ddy * push;
              }
            }
          }
        }
      }
    }
    }   // end wavePhase !== 'boss'

    // Boss 环形弹幕：移动 + 命中玩家
    for (i = S.ebullets.length - 1; i >= 0; i--) {
      var eb = S.ebullets[i];
      eb.x += eb.vx * dt; eb.y += eb.vy * dt; eb.life -= dt;
      if (eb.life <= 0 || eb.x < -60 || eb.x > W + 60 || eb.y < -60 || eb.y > H + 60) {
        poolGive('ebullets', S.ebullets, i); continue;
      }
      var edx = p.x - eb.x, edy = p.y - eb.y, er2 = eb.r + p.r;
      if (edx * edx + edy * edy <= er2 * er2) {
        sparkBurst(eb.x, eb.y, 4, '#ff6fae');
        if (p.inv <= 0 && p.shield <= 0) hurtPlayer(eb);
        poolGive('ebullets', S.ebullets, i);
      }
    }

    // 掉落物：磁吸 + 拾取 + 过期
    for (i = S.pickups.length - 1; i >= 0; i--) {
      var pk = S.pickups[i];
      pk.life -= dt;
      if (pk.life <= 0) { poolGive('pickups', S.pickups, i); continue; }
      var pdx = p.x - pk.x, pdy = p.y - pk.y, pd = Math.hypot(pdx, pdy) || 1;
      var magnetR = CFG.pickup.magnet * (S.upgrades ? S.upgrades.magnet : 1);
      if (pd < magnetR) {
        var pull = 340 * (1 - pd / magnetR) + 120;
        pk.x += pdx / pd * pull * dt;
        pk.y += pdy / pd * pull * dt;
      }
      if (pd < p.r + CFG.pickup.radius) {
        collectPickup(pk);
        poolGive('pickups', S.pickups, i);
      }
    }

    // 生成：警告期与 Boss 战停刷；波次越高刷新越快
    if (S.wavePhase === 'normal') {
      S.spawnTimer -= dt;
      if (S.spawnTimer <= 0) {
        S.spawnTimer = Math.max(CFG.enemy.spawnMin, CFG.enemy.spawnBase - S.elapsed * CFG.enemy.spawnRamp)
          * Math.pow(0.9, Math.max(0, S.wave - 1));
        var burst = 1 + Math.min(2, Math.floor(S.elapsed / CFG.enemy.burstEvery));
        for (j = 0; j < burst && S.enemies.length < CFG.enemy.cap; j++) spawnEnemy();
      }
    }

    // 连击窗口（Boss 战期间冻结，避免打 Boss 反而掉火力）
    if (S.wavePhase !== 'boss' && S.combo > 0) {
      S.comboTimer -= dt;
      if (S.comboTimer <= 0) { S.combo = 0; S.comboTimer = 0; }
    }
    if (S.waveBanner > 0) S.waveBanner = Math.max(0, S.waveBanner - dt);
    if (S.evoBanner > 0) S.evoBanner = Math.max(0, S.evoBanner - dt);
    if (S.victoryFlash > 0) S.victoryFlash = Math.max(0, S.victoryFlash - dt);
    if (S.sysLog) {
      S.sysLog.t += dt;
      if (S.sysLog.t > S.sysLog.dur) S.sysLog = null;
    }
    S.comboPop = Math.max(0, S.comboPop - 6 * dt);
    updateMusicLayers();   // 连击变化 → 音乐层目标平滑切换
    updateStory(dt);       // 连击阈值 → 碎片文本（纯数值判断 + 单次 fillText）

    // 屏幕震动：trauma² 曲线 + 硬上限 + 低频平滑摆动（避免每帧随机抖动）
    updateShake(dt);

    S.hurtFlash = Math.max(0, S.hurtFlash - dt);

    // 粒子：寿命到或飞出屏外即回收进池
    for (i = S.sparks.length - 1; i >= 0; i--) {
      var sp = S.sparks[i];
      sp.x += sp.vx * dt; sp.y += sp.vy * dt;
      sp.vx *= (1 - 5 * dt); sp.vy *= (1 - 5 * dt);
      sp.life -= dt;
      if (sp.life <= 0 || sp.x < -120 || sp.x > W + 120 || sp.y < -120 || sp.y > H + 120) {
        poolGive('sparks', S.sparks, i);
      }
    }
    for (i = S.chunks.length - 1; i >= 0; i--) {
      var ch = S.chunks[i];
      ch.x += ch.vx * dt; ch.y += ch.vy * dt;
      ch.vx *= (1 - 4 * dt); ch.vy *= (1 - 4 * dt);
      ch.rot += ch.vr * dt;
      ch.life -= dt;
      if (ch.life <= 0 || ch.x < -120 || ch.x > W + 120 || ch.y < -120 || ch.y > H + 120) {
        poolGive('chunks', S.chunks, i);
      }
    }
    for (i = S.rings.length - 1; i >= 0; i--) {
      var rgp = S.rings[i];
      rgp.life -= dt;
      if (rgp.life <= 0) poolGive('rings', S.rings, i);
    }
    for (i = S.floats.length - 1; i >= 0; i--) {
      var flp = S.floats[i];
      flp.y += flp.vy * dt;
      flp.life -= dt;
      if (flp.life <= 0 || flp.y < -120) poolGive('floats', S.floats, i);
    }
    // 电弧视觉是瞬态：必须随普通帧一起衰减，否则会永久残留
    for (i = S.chainFx.length - 1; i >= 0; i--) {
      S.chainFx[i].life -= dt;
      if (S.chainFx[i].life <= 0) S.chainFx.splice(i, 1);
    }
  }

  // ===== 渲染 =====
  var canvas = document.getElementById('game');
  var dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = W * dpr;
  canvas.height = H * dpr;
  var ctx = canvas.getContext('2d');

  function fit() {
    var scale = Math.max(0.3, Math.min((window.innerWidth - 24) / W, (window.innerHeight - 24) / H));
    canvas.style.width = (W * scale) + 'px';
    canvas.style.height = (H * scale) + 'px';
  }

  function drawBackground() {
    ctx.fillStyle = COL.bg;
    ctx.fillRect(0, 0, W, H);
    var g = ctx.createRadialGradient(W / 2, H / 2, 40, W / 2, H / 2, 700);
    g.addColorStop(0, 'rgba(28, 52, 110, 0.22)');
    g.addColorStop(1, 'rgba(0, 0, 0, 0)');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);

    var off = (S.time * 14) % 60;
    ctx.strokeStyle = COL.grid;
    ctx.lineWidth = 1;
    ctx.beginPath();
    for (var x = -60 + off; x < W + 60; x += 60) { ctx.moveTo(x, 0); ctx.lineTo(x, H); }
    for (var y = -60 + off; y < H + 60; y += 60) { ctx.moveTo(0, y); ctx.lineTo(W, y); }
    ctx.stroke();
  }

  function traceShip(shape) {
    ctx.beginPath();
    if (shape === 'chevron') {
      ctx.moveTo(20, 0); ctx.lineTo(-7, 9); ctx.lineTo(-1, 0); ctx.lineTo(-7, -9);
    } else if (shape === 'hex') {
      ctx.moveTo(16, 0); ctx.lineTo(8, 9); ctx.lineTo(-7, 11);
      ctx.lineTo(-13, 0); ctx.lineTo(-7, -11); ctx.lineTo(8, -9);
    } else {
      ctx.moveTo(17, 0); ctx.lineTo(-11, 10); ctx.lineTo(-4, 0); ctx.lineTo(-11, -10);
    }
    ctx.closePath();
  }

  // 渲染裁剪：屏幕外（含 margin）对象不绘制。出界对象由 update 回收，观感不变。
  var CULL_MARGIN = 64;
  var renderStats = { drawn: 0, culled: 0 };
  function inView(x, y, pad) {
    var m = CULL_MARGIN + (pad || 0);
    return x > -m && x < W + m && y > -m && y < H + m;
  }

  function drawBoss() {
    var b = S.boss;
    if (!b) return;
    var form = b.state === 'forming' ? Math.min(1, b.formT / CFG.wave.bossForm) : 1;
    var scale = 0.4 + 0.6 * form;
    ctx.save();
    ctx.translate(b.x, b.y);
    ctx.rotate(S.time * 0.35);
    ctx.scale(scale, scale);
    ctx.shadowColor = '#ff3f8e';
    ctx.shadowBlur = 26;
    ctx.fillStyle = b.flash > 0 ? '#ffffff' : '#ff3f8e';
    ctx.beginPath();
    for (var i = 0; i < 6; i++) {
      var a = i * TAU / 6;
      var px = Math.cos(a) * b.r, py = Math.sin(a) * b.r;
      if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
    }
    ctx.closePath();
    ctx.fill();
    ctx.rotate(-S.time * 0.9);
    ctx.globalAlpha = 0.5;
    ctx.fillStyle = '#ffe27a';
    ctx.beginPath();
    for (i = 0; i < 3; i++) {
      var a2 = i * TAU / 3 - Math.PI / 2, r2 = b.r * 0.52;
      var qx = Math.cos(a2) * r2, qy = Math.sin(a2) * r2;
      if (i === 0) ctx.moveTo(qx, qy); else ctx.lineTo(qx, qy);
    }
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  }

  function drawEBullets() {
    ctx.globalCompositeOperation = 'lighter';
    for (var i = 0; i < S.ebullets.length; i++) {
      var eb = S.ebullets[i];
      ctx.fillStyle = eb.color;
      ctx.shadowColor = eb.color;
      ctx.shadowBlur = 12;
      ctx.beginPath();
      ctx.arc(eb.x, eb.y, eb.r, 0, TAU);
      ctx.fill();
    }
    ctx.shadowBlur = 0;
    ctx.globalCompositeOperation = 'source-over';
  }

  function drawWings() {
    var p = S.player;
    if (!p || !S.wings.length) return;
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    for (var i = 0; i < S.wings.length; i++) {
      var wg = S.wings[i];
      ctx.globalAlpha = 1;
      ctx.fillStyle = '#7fe8ff';
      ctx.shadowColor = '#7fe8ff';
      ctx.shadowBlur = 10;
      var s = 7 + Math.min(3, S.wingLevel * 0.5);
      ctx.beginPath();
      ctx.moveTo(wg.x, wg.y - s);
      ctx.lineTo(wg.x + s * 0.8, wg.y);
      ctx.lineTo(wg.x, wg.y + s);
      ctx.lineTo(wg.x - s * 0.8, wg.y);
      ctx.closePath();
      ctx.fill();
      if (wg.flash > 0) {
        ctx.globalAlpha = wg.flash / 0.12;
        ctx.strokeStyle = '#dff7ff';
        ctx.beginPath();
        ctx.arc(wg.x, wg.y, 10, 0, TAU);
        ctx.stroke();
      }
    }
    ctx.restore();
  }

  function drawChainFx() {
    if (!S.chainFx.length) return;
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    ctx.lineWidth = 1.8;
    for (var i = 0; i < S.chainFx.length; i++) {
      var fx = S.chainFx[i];
      var a = fx.life / fx.max;
      ctx.globalAlpha = a;
      ctx.strokeStyle = fx.color;
      ctx.beginPath();
      ctx.moveTo(fx.x1, fx.y1);
      var mx = (fx.x1 + fx.x2) / 2, my = (fx.y1 + fx.y2) / 2;
      var px = -(fx.y2 - fx.y1), py = fx.x2 - fx.x1;
      var len = Math.sqrt(px * px + py * py) || 1;
      ctx.lineTo(mx + px / len * 10, my + py / len * 10);
      ctx.lineTo(fx.x2, fx.y2);
      ctx.stroke();
    }
    ctx.restore();
  }

  function drawAffixFields() {
    for (var i = 0; i < S.fields.length; i++) {
      var f = S.fields[i], a = clamp(f.life / f.max, 0, 1);
      ctx.save();
      ctx.translate(f.x, f.y);
      ctx.globalAlpha = 0.3 + a * 0.55;
      ctx.fillStyle = 'rgba(94, 232, 255, 0.10)';
      ctx.beginPath(); ctx.arc(0, 0, f.r, 0, TAU); ctx.fill();
      ctx.strokeStyle = '#5ee8ff';
      ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(0, 0, f.r, 0, TAU); ctx.stroke();
      ctx.rotate(S.time * 5);
      ctx.strokeStyle = '#bff4ff';
      ctx.lineWidth = 1.5;
      for (var k = 0; k < 3; k++) {
        ctx.beginPath();
        ctx.arc(0, 0, f.r * (0.45 + k * 0.16), k * 2.1, k * 2.1 + 1.1);
        ctx.stroke();
      }
      ctx.restore();
    }
  }

  function drawAffixEffects() {
    var i, b, g, l;
    for (i = 0; i < S.affixGhosts.length; i++) {
      g = S.affixGhosts[i];
      var ga = clamp(g.life / g.max, 0, 1);
      ctx.save();
      ctx.translate(g.x, g.y);
      ctx.rotate(S.time * 2 + i);
      ctx.globalAlpha = ga * 0.45;
      ctx.strokeStyle = g.color;
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(0, -g.r); ctx.lineTo(g.r * 0.86, 0);
      ctx.lineTo(0, g.r); ctx.lineTo(-g.r * 0.86, 0);
      ctx.closePath(); ctx.stroke();
      ctx.restore();
    }
    for (i = 0; i < S.affixLinks.length; i++) {
      l = S.affixLinks[i];
      var la = clamp(l.life / l.max, 0, 1);
      ctx.save();
      ctx.globalAlpha = la * 0.55;
      ctx.strokeStyle = '#6dffb0';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(l.x1, l.y1);
      ctx.lineTo(l.x2, l.y2);
      ctx.stroke();
      ctx.restore();
    }
    for (i = 0; i < S.affixBlasts.length; i++) {
      b = S.affixBlasts[i];
      var bt = 1 - clamp(b.life / b.max, 0, 1);
      ctx.save();
      ctx.translate(b.x, b.y);
      ctx.globalAlpha = 0.55 + bt * 0.35;
      ctx.fillStyle = 'rgba(255, 138, 92, ' + (0.06 + bt * 0.16) + ')';
      ctx.beginPath(); ctx.arc(0, 0, b.r * (0.35 + bt * 0.65), 0, TAU); ctx.fill();
      ctx.strokeStyle = '#ff8a5c';
      ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(0, 0, b.r, 0, TAU); ctx.stroke();
      ctx.strokeStyle = '#ffd2a8';
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.arc(0, 0, b.r * (0.35 + bt * 0.65), -Math.PI / 2, -Math.PI / 2 + TAU * bt);
      ctx.stroke();
      ctx.restore();
    }
  }

  function drawWorld() {
    var i, t, p = S.player;
    renderStats.drawn = 0;
    renderStats.culled = 0;

    // 扩散环 + 火花（加色）
    ctx.globalCompositeOperation = 'lighter';
    for (i = 0; i < S.rings.length; i++) {
      var rg = S.rings[i];
      if (!inView(rg.x, rg.y, rg.r1 + 2)) { renderStats.culled++; continue; }
      renderStats.drawn++;
      t = 1 - rg.life / rg.max;
      ctx.globalAlpha = (rg.life / rg.max) * 0.9;
      ctx.strokeStyle = rg.color;
      ctx.lineWidth = 2.5;
      ctx.beginPath();
      ctx.arc(rg.x, rg.y, rg.r + (rg.r1 - rg.r) * t, 0, TAU);
      ctx.stroke();
    }
    for (i = 0; i < S.sparks.length; i++) {
      var sp = S.sparks[i];
      if (!inView(sp.x, sp.y, sp.size + 12)) { renderStats.culled++; continue; }
      renderStats.drawn++;
      ctx.globalAlpha = Math.max(0, sp.life / sp.max);
      ctx.strokeStyle = sp.color;
      ctx.lineWidth = sp.size;
      ctx.beginPath();
      ctx.moveTo(sp.x, sp.y);
      ctx.lineTo(sp.x - sp.vx * 0.02, sp.y - sp.vy * 0.02);
      ctx.stroke();
    }
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'source-over';

    // 碎片
    for (i = 0; i < S.chunks.length; i++) {
      var ch = S.chunks[i];
      if (!inView(ch.x, ch.y, ch.size + 8)) { renderStats.culled++; continue; }
      renderStats.drawn++;
      ctx.save();
      ctx.globalAlpha = Math.max(0, ch.life / ch.max);
      ctx.translate(ch.x, ch.y);
      ctx.rotate(ch.rot);
      ctx.fillStyle = ch.color;
      ctx.fillRect(-ch.size / 2, -ch.size / 2, ch.size, ch.size);
      ctx.restore();
    }

    // 子弹（不同枪型不同颜色/长度；穿透弹更细更长）
    ctx.globalCompositeOperation = 'lighter';
    ctx.shadowColor = '#9ff6ff';
    ctx.shadowBlur = 10;
    for (i = 0; i < S.bullets.length; i++) {
      var b = S.bullets[i];
      if (!inView(b.x, b.y, b.pierce ? 48 : 30)) { renderStats.culled++; continue; }
      renderStats.drawn++;
      ctx.strokeStyle = b.color || COL.bullet;
      ctx.shadowColor = b.color || '#9ff6ff';
      ctx.lineWidth = b.child ? 2 : (b.pierce ? 2.5 : 3);
      ctx.beginPath();
      ctx.moveTo(b.x - b.vx * (b.pierce ? 0.03 : 0.018), b.y - b.vy * (b.pierce ? 0.03 : 0.018));
      ctx.lineTo(b.x, b.y);
      ctx.stroke();
    }
    ctx.shadowBlur = 0;
    ctx.globalCompositeOperation = 'source-over';

    drawAffixFields();
    drawAffixEffects();

    // 敌人
    for (i = 0; i < S.enemies.length; i++) {
      var e = S.enemies[i];
      if (!inView(e.x, e.y, e.r + 10)) { renderStats.culled++; continue; }
      renderStats.drawn++;
      var affix = e.affix ? CFG.affixes[e.affix] : null;
      var ac = affix ? affix.color : null;
      ctx.save();
      ctx.translate(e.x, e.y);
      // 迅捷：朝玩家方向的拖尾速度线
      if (e.affix === 'swift') {
        var sa = Math.atan2(S.player.y - e.y, S.player.x - e.x);
        ctx.save();
        ctx.rotate(sa);
        ctx.globalAlpha = 0.35 + 0.2 * Math.sin(S.time * 18 + e.phase);
        ctx.strokeStyle = ac;
        ctx.lineWidth = 1.5;
        for (var sk = -1; sk <= 1; sk += 2) {
          ctx.beginPath();
          ctx.moveTo(-e.r * 1.1, sk * e.r * 0.45);
          ctx.lineTo(-e.r * (2.3 + sk * 0.2), sk * e.r * 0.85);
          ctx.stroke();
        }
        ctx.restore();
      }
      if (e.affix === 'tractor') {
        var tdx = S.player.x - e.x, tdy = S.player.y - e.y, tdd = Math.hypot(tdx, tdy);
        if (tdd < 260) {
          ctx.save();
          ctx.globalAlpha = 0.25 + 0.2 * Math.abs(Math.sin(S.time * 9 + e.phase));
          ctx.strokeStyle = ac;
          ctx.lineWidth = 2;
          ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(tdx, tdy); ctx.stroke();
          ctx.restore();
        }
      }
      ctx.rotate(S.time * 2 + e.phase);
      ctx.shadowColor = ac || COL.enemy;
      ctx.shadowBlur = ac ? 14 : 8;
      ctx.fillStyle = e.flash > 0 ? '#ffffff' : (ac || COL.enemy);
      if (e.affix === 'phase') ctx.globalAlpha = 0.65 + 0.35 * Math.abs(Math.sin(S.time * 8 + e.phase));
      ctx.beginPath();
      ctx.moveTo(0, -e.r);
      ctx.lineTo(e.r * 0.86, 0);
      ctx.lineTo(0, e.r);
      ctx.lineTo(-e.r * 0.86, 0);
      ctx.closePath();
      ctx.fill();
      ctx.globalAlpha = 1;
      // 分裂：两颗环绕的紫色碎片
      if (e.affix === 'split') {
        ctx.shadowBlur = 8;
        ctx.fillStyle = '#e4d4ff';
        for (var sp = 0; sp < 2; sp++) {
          var spa = S.time * 3.4 + sp * Math.PI;
          ctx.save();
          ctx.translate(Math.cos(spa) * (e.r + 7), Math.sin(spa) * (e.r + 7));
          ctx.rotate(spa);
          ctx.fillRect(-2.5, -2.5, 5, 5);
          ctx.restore();
        }
      }
      // 磁暴：环绕电弧
      if (e.affix === 'magnet') {
        ctx.shadowBlur = 0;
        ctx.strokeStyle = ac;
        ctx.lineWidth = 1.5;
        ctx.globalAlpha = 0.55 + 0.25 * Math.sin(S.time * 12 + e.phase);
        for (var ma = 0; ma < 2; ma++) {
          ctx.beginPath();
          ctx.arc(0, 0, e.r + 6 + ma * 4, S.time * 4 + ma * 2.4, S.time * 4 + ma * 2.4 + 1.2);
          ctx.stroke();
        }
      }
      // 装甲：银色护盾弧
      if (e.affix === 'armored') {
        ctx.shadowBlur = 0;
        ctx.strokeStyle = '#e8f0ff';
        ctx.lineWidth = 2;
        ctx.globalAlpha = 0.75;
        ctx.beginPath();
        ctx.arc(0, 0, e.r + 6, -2.25, 0.65);
        ctx.stroke();
        ctx.beginPath();
        ctx.arc(0, 0, e.r + 6, 2.0, 4.9);
        ctx.stroke();
      }
      // 爆裂：亮橙脉冲环
      if (e.affix === 'volatile') {
        ctx.shadowBlur = 0;
        ctx.strokeStyle = ac;
        ctx.lineWidth = 2;
        ctx.globalAlpha = 0.45 + 0.3 * Math.sin(S.time * 11 + e.phase);
        ctx.beginPath(); ctx.arc(0, 0, e.r + 5, 0, TAU); ctx.stroke();
      }
      // 寄生：三颗绿色孢子
      if (e.affix === 'parasitic') {
        ctx.shadowBlur = 6;
        ctx.shadowColor = ac;
        ctx.fillStyle = ac;
        for (var pp = 0; pp < 3; pp++) {
          var ppa = S.time * 2.1 + pp * TAU / 3;
          ctx.beginPath();
          ctx.arc(Math.cos(ppa) * (e.r + 8), Math.sin(ppa) * (e.r + 8), 2.2, 0, TAU);
          ctx.fill();
        }
      }
      // 被寄生死亡强化：绿色光环
      if (e.buffT > 0) {
        ctx.shadowBlur = 0;
        ctx.strokeStyle = '#6dffb0';
        ctx.lineWidth = 2;
        ctx.globalAlpha = 0.5 + 0.25 * Math.sin(S.time * 12);
        ctx.beginPath(); ctx.arc(0, 0, e.r + 10, 0, TAU); ctx.stroke();
      }
      ctx.globalAlpha = 1;
      if (e.maxHp > 1) {
        ctx.rotate(-(S.time * 2 + e.phase));
        ctx.shadowBlur = 0;
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.65)';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(0, 0, e.r + 5, -Math.PI / 2, -Math.PI / 2 + TAU * (e.hp / e.maxHp));
        ctx.stroke();
      }
      ctx.restore();
    }

    // Boss + 环形弹幕
    if (S.boss) drawBoss();
    drawEBullets();
    drawChainFx();

    // 掉落物（最后 3 秒闪烁）
    for (i = 0; i < S.pickups.length; i++) {
      var pk = S.pickups[i];
      if (!inView(pk.x, pk.y, 26)) { renderStats.culled++; continue; }
      renderStats.drawn++;
      var info = CFG.pickupInfo[pk.type];
      var pa = pk.life < 3 ? 0.35 + 0.65 * Math.abs(Math.sin(S.time * 10)) : 1;
      ctx.save();
      ctx.translate(pk.x, pk.y);
      ctx.rotate(S.time * 1.6 + pk.bob);
      ctx.globalAlpha = pa;
      ctx.shadowColor = info.color;
      ctx.shadowBlur = 14;
      ctx.fillStyle = info.color;
      ctx.fillRect(-10, -10, 20, 20);
      ctx.restore();
      ctx.save();
      ctx.translate(pk.x, pk.y);
      ctx.globalAlpha = pa;
      ctx.fillStyle = '#0b1020';
      ctx.font = '800 13px ' + FONT;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(info.glyph, 0, 0);
      ctx.restore();
    }

    drawWings();

    // 玩家（按机型换外形/颜色，无敌时闪烁）
    var sh = ship();
    var blink = p.inv > 0 && Math.floor(S.time * 22) % 2 === 0;
    ctx.save();
    ctx.translate(p.x, p.y);
    ctx.rotate(p.aim);
    ctx.scale(p.r / 12, p.r / 12);
    ctx.globalAlpha = blink ? 0.35 : 1;
    ctx.shadowColor = sh.color;
    ctx.shadowBlur = 18;
    ctx.fillStyle = sh.color;
    traceShip(sh.shape);
    ctx.fill();
    ctx.shadowBlur = 0;
    ctx.fillStyle = '#ffffff';
    ctx.beginPath();
    ctx.arc(2, 0, 3, 0, TAU);
    ctx.fill();
    ctx.restore();

    // 护盾环
    if (p.shield > 0) {
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.globalAlpha = 0.5 + 0.3 * Math.sin(S.time * 12);
      ctx.strokeStyle = '#5ee8ff';
      ctx.lineWidth = 2;
      ctx.shadowColor = '#5ee8ff';
      ctx.shadowBlur = 14;
      ctx.beginPath();
      ctx.arc(0, 0, p.r + 10, 0, TAU);
      ctx.stroke();
      ctx.restore();
    }

    // 枪口闪光
    if (S.muzzle > 0) {
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.aim);
      ctx.globalAlpha = S.muzzle / CFG.fx.muzzle;
      ctx.globalCompositeOperation = 'lighter';
      ctx.fillStyle = '#fff6a8';
      ctx.beginPath();
      ctx.moveTo(18, 0); ctx.lineTo(32, 6); ctx.lineTo(32, -6);
      ctx.closePath();
      ctx.fill();
      ctx.restore();
    }

    // 浮动文字
    for (i = 0; i < S.floats.length; i++) {
      var fl = S.floats[i];
      if (!inView(fl.x, fl.y, 100)) { renderStats.culled++; continue; }
      renderStats.drawn++;
      ctx.save();
      ctx.globalAlpha = Math.max(0, fl.life / fl.max);
      ctx.fillStyle = fl.color;
      ctx.font = '800 ' + fl.size + 'px ' + FONT;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(fl.text, fl.x, fl.y);
      ctx.restore();
    }
  }

  function bar(x, y, w, h, pct, color) {
    ctx.fillStyle = 'rgba(120, 150, 200, 0.18)';
    ctx.fillRect(x, y, w, h);
    ctx.fillStyle = color;
    ctx.fillRect(x, y, w * clamp(pct, 0, 1), h);
  }

  function drawWaveWarning() {
    var a = 0.20 + 0.12 * Math.sin(S.time * 9);
    ctx.save();
    ctx.globalAlpha = a * 0.42;
    ctx.fillStyle = '#ff2d5e';
    ctx.fillRect(0, 0, W, H);        // 全屏红光脉冲
    ctx.globalAlpha = a;
    ctx.fillStyle = '#ff2d5e';
    var e = 46;
    ctx.fillRect(0, 0, W, e);
    ctx.fillRect(0, H - e, W, e);
    ctx.fillRect(0, 0, e, H);
    ctx.fillRect(W - e, 0, e, H);
    ctx.restore();
    ctx.save();
    ctx.globalAlpha = 0.45 + 0.35 * Math.sin(S.time * 9);
    ctx.textAlign = 'center';
    ctx.fillStyle = '#ff5c86';
    ctx.font = '600 13px ' + FONT;
    ctx.fillText('WARNING // 高能信号接近', W / 2, 142);
    ctx.restore();
  }

  function drawHUD() {
    var p = S.player, sh = ship(), w = weapon();
    ctx.textBaseline = 'middle';

    // HP（按机型上限）
    ctx.textAlign = 'left';
    for (var i = 0; i < p.maxHp; i++) {
      var x = 32 + i * 28, y = 34;
      ctx.beginPath();
      ctx.moveTo(x, y - 10); ctx.lineTo(x + 9, y); ctx.lineTo(x, y + 10); ctx.lineTo(x - 9, y);
      ctx.closePath();
      if (i < p.hp) {
        ctx.fillStyle = sh.color;
        ctx.shadowColor = sh.color;
        ctx.shadowBlur = 10;
        ctx.fill();
        ctx.shadowBlur = 0;
      } else {
        ctx.strokeStyle = 'rgba(120, 150, 200, 0.35)';
        ctx.lineWidth = 1.5;
        ctx.stroke();
      }
    }

    // 波次
    ctx.textAlign = 'left';
    ctx.font = '600 13px ' + FONT;
    ctx.fillStyle = S.wavePhase === 'warning' ? '#ff5c86' : (S.wavePhase === 'boss' ? '#ff8fb8' : '#9fc4ff');
    ctx.fillText('WAVE ' + S.wave + (S.wavePhase === 'boss' ? ' · BOSS' : ''), 32, 66);
    if (S.waveAffixes.length && S.wavePhase !== 'boss') {
      var ax = 32;
      ctx.font = '600 10px ' + FONT;
      ctx.fillStyle = 'rgba(150, 180, 220, 0.6)';
      ctx.fillText('AFFIX', ax, 84);
      ax += 40;
      for (var ai = 0; ai < S.waveAffixes.length; ai++) {
        var ad = CFG.affixes[S.waveAffixes[ai]];
        ctx.fillStyle = ad.color;
        ctx.fillText(ad.name, ax, 84);
        ax += ctx.measureText(ad.name).width + 10;
      }
    }

    // Boss 血条
    if (S.boss) {
      var bbw = 420, bbh = 8, bbx = (W - bbw) / 2, bby = 72;
      var hpRatio = S.boss.maxHp > 0 ? S.boss.hp / S.boss.maxHp : 0;
      ctx.fillStyle = 'rgba(255, 63, 142, 0.16)';
      ctx.fillRect(bbx, bby, bbw, bbh);
      ctx.fillStyle = '#ff3f8e';
      ctx.fillRect(bbx, bby, bbw * clamp(hpRatio, 0, 1), bbh);
      ctx.textAlign = 'center';
      ctx.fillStyle = '#ffb0d0';
      ctx.font = '600 11px ' + FONT;
      ctx.fillText('BOSS · WAVE ' + S.wave + ' · ' + Math.max(0, Math.ceil(S.boss.hp)) + ' / ' + S.boss.maxHp, W / 2, bby + 18);
    }

    // 波次横幅
    if (S.waveBanner > 0) {
      var wa = clamp(S.waveBanner / 2.2, 0, 1);
      ctx.save();
      ctx.globalAlpha = wa * 0.85;
      ctx.textAlign = 'center';
      ctx.fillStyle = '#9EE7FF';
      ctx.font = '800 34px ' + FONT;
      ctx.fillText(S.waveBannerText, W / 2, H / 2 - 150);
      ctx.restore();
    }

    // 武器进化横幅
    if (S.evoBanner > 0) {
      var ea = clamp(S.evoBanner / 1.8, 0, 1);
      var evoName = evoInfo(S.evolved).name;
      var evoSub = S.evoBannerSub || evoInfo(S.evolved).sub;
      ctx.save();
      ctx.globalAlpha = ea * 0.9;
      ctx.textAlign = 'center';
      ctx.fillStyle = '#ffd45e';
      ctx.font = '600 12px ' + FONT;
      ctx.fillText(S.evoBannerTitle || 'WEAPON EVOLUTION', W / 2, H / 2 - 168);
      ctx.font = '800 34px ' + FONT;
      ctx.shadowColor = '#ffd45e';
      ctx.shadowBlur = 22;
      ctx.fillText(evoName, W / 2, H / 2 - 134);
      ctx.shadowBlur = 0;
      ctx.fillStyle = 'rgba(220, 235, 255, 0.6)';
      ctx.font = '500 12px ' + FONT;
      ctx.fillText(evoSub, W / 2, H / 2 - 108);
      ctx.restore();
    }

    // 分数
    ctx.textAlign = 'center';
    ctx.fillStyle = COL.text;
    ctx.font = '700 30px ' + FONT;
    ctx.fillText(String(S.score).padStart(5, '0'), W / 2, 36);
    ctx.fillStyle = COL.dim;
    ctx.font = '600 11px ' + FONT;
    ctx.fillText('SCORE', W / 2, 60);

    // 击杀 / 时间
    ctx.textAlign = 'right';
    ctx.font = '600 13px ' + FONT;
    ctx.fillStyle = '#9fc4ff';
    ctx.fillText(S.kills + ' KILLS', W - 30, 30);
    ctx.fillText(S.elapsed.toFixed(1) + ' s', W - 30, 50);

    // 自适应音乐层指示：K 底鼓 / H 踩镲 / B 贝斯 / A 琶音
    var tier = musicTier(S.combo);
    var pipColors = ['#eaf6ff', '#5ee8ff', '#ffb03f', '#ff6fae'];
    for (var mi = 0; mi < 4; mi++) {
      var lit = !bossMusic.wanted && (mi === 0 || tier >= mi);
      ctx.fillStyle = lit ? pipColors[mi] : 'rgba(120, 150, 200, 0.18)';
      ctx.fillRect(W - 118 + mi * 22, 70, 14, 6);
    }
    ctx.textAlign = 'right';
    ctx.fillStyle = 'rgba(150, 180, 230, 0.45)';
    ctx.font = '500 10px ' + FONT;
    if (bossMusic.wanted) {
      ctx.fillText('BPM ' + bossMusic.bpm + ' · BOSS THEME', W - 30, 88);
    } else {
      ctx.fillText('BPM ' + BPM + ' · MUSIC L' + (tier + 1), W - 30, 88);
    }

    // 连击
    ctx.textAlign = 'left';
    var cx = 34, cy = H - 96;
    ctx.save();
    ctx.translate(cx, cy);
    var sc = 1 + S.comboPop * 0.35;
    ctx.scale(sc, sc);
    ctx.font = '800 46px ' + FONT;
    ctx.fillStyle = S.combo > 0 ? '#ffe27a' : 'rgba(180, 200, 240, 0.22)';
    ctx.fillText('\u00d7' + S.combo, 0, 0);
    ctx.restore();

    bar(cx, H - 66, 230, 6, S.comboTimer / comboWindow(),
        S.combo > 0 ? '#ffd45e' : 'rgba(120, 150, 200, 0.25)');

    ctx.font = '600 12px ' + FONT;
    ctx.fillStyle = S.evolved ? '#ffd45e' : '#8fb8ff';
    var matCount = S.evolved && S.evoMats[S.evolved] ? S.evoMats[S.evolved].length : 0;
    ctx.fillText(
      'WPN ' + w.name + (S.evolved ? ' · EVO Lv.' + S.evoTier + ' · 素材 ' + matCount + '/4' : '') +
      (S.evoForms.length > 1 ? ' · Q切换' : '') +
      ' · ' + (1 / fireInterval()).toFixed(1) + ' 发/s · ' +
      pellets() + ' 弹 · 伤害 ' + damage().toFixed(1),
      cx, H - 46
    );

    // 融合素材：4 个限时槽位
    if (S.evolved) {
      var mats = S.evoMats[S.evolved] || [];
      ctx.textAlign = 'left';
      ctx.fillStyle = 'rgba(150, 180, 230, 0.55)';
      ctx.font = '600 10px ' + FONT;
      ctx.fillText('FUSION ENERGY ' + mats.length + '/4' +
        (S.wavePhase === 'boss' ? ' · BOSS 半耗' : ''), W - 276, H - 82);
      var totalEnergy = 0, totalMax = 0;
      for (var fm = 0; fm < 4; fm++) {
        var mt = mats[fm];
        var mx = W - 276 + fm * 62, my = H - 72;
        ctx.fillStyle = mt ? CFG.weapons[mt.type].color : 'rgba(120, 150, 200, 0.16)';
        ctx.font = '700 10px ' + FONT;
        ctx.fillText(mt ? CFG.weapons[mt.type].name.charAt(0) : '·', mx, my);
        ctx.fillStyle = 'rgba(120, 150, 200, 0.22)';
        ctx.fillRect(mx, my + 6, 48, 4);
        if (mt) {
          totalEnergy += mt.life;
          totalMax += mt.max;
          ctx.fillStyle = CFG.weapons[mt.type].color;
          ctx.fillRect(mx, my + 6, 48 * Math.max(0, mt.life / mt.max), 4);
        }
      }
      ctx.fillStyle = 'rgba(120, 150, 200, 0.22)';
      ctx.fillRect(W - 276, H - 58, 248, 2);
      ctx.fillStyle = S.evoTier === 3 ? '#ffd45e' : '#8fb8ff';
      ctx.fillRect(W - 276, H - 58, 248 * clamp(totalEnergy / (totalMax || 1), 0, 1), 2);
    } else if (S.energyBank > 0) {
      ctx.textAlign = 'left';
      ctx.fillStyle = 'rgba(150, 180, 230, 0.55)';
      ctx.font = '600 10px ' + FONT;
      ctx.fillText('STANDBY ENERGY ' + Math.round(S.energyBank) + '%', W - 276, H - 72);
      ctx.fillStyle = 'rgba(120, 150, 200, 0.22)';
      ctx.fillRect(W - 276, H - 64, 248, 3);
      ctx.fillStyle = '#5ee8ff';
      ctx.fillRect(W - 276, H - 64, 248 * clamp(S.energyBank / 100, 0, 1), 3);
    }
    ctx.fillStyle = '#7fe8ff';
    ctx.font = '600 11px ' + FONT;
    ctx.fillText('WING \u00d7' + S.wingCount + ' \u00b7 Lv.' + S.wingLevel, cx, H - 30);

    // 增益计时
    var chips = [];
    if (p.shield > 0) chips.push(['护盾', p.shield, 3.5, '#5ee8ff']);
    if (p.over > 0) chips.push(['超载', p.over, 8, '#ffb03f']);
    if (S.slow > 0) chips.push(['时缓', S.slow, 4.5, '#b98cff']);
    for (var c = 0; c < chips.length; c++) {
      var chY = H - 176 - c * 26;
      ctx.textAlign = 'left';
      ctx.font = '600 12px ' + FONT;
      ctx.fillStyle = chips[c][3];
      ctx.fillText(chips[c][0] + ' ' + chips[c][1].toFixed(1) + 's', cx, chY);
      bar(cx, chY + 8, 120, 4, chips[c][1] / chips[c][2], chips[c][3]);
    }

    // 底部提示
    ctx.textAlign = 'center';
    if (!actx) {
      ctx.fillStyle = 'rgba(255, 210, 120, 0.85)';

  function drawHurt() {
    var p = S.player;
    var a = S.hurtFlash / CFG.fx.hurtFlash;
    if (p.hp === 1) a = Math.max(a, 0.10 + 0.05 * Math.sin(S.time * 6));

    var g = ctx.createRadialGradient(W / 2, H / 2, H * 0.32, W / 2, H / 2, H * 0.95);
    g.addColorStop(0, 'rgba(255, 40, 90, 0)');
